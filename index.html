    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
       body { 
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            min-height: 100dvh;
            height: auto;

        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Toast Notifications */

        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Typography refinements */

        .tracking-widest {

        .bg-banner::before {

            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);

        /* Glassmorphism utilities */

        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Print adjustments */
        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }

   <script>
     let state = {
    currentTab: 'tong-quan',
    auth: { loggedIn: false, role: 'gvcn' }, 
    loginRoleSelect: 'gvcn',
    auditLogs: [],
            theme: { month: "CHỦ ĐIỂM THÁNG", title: "CHUYẾN TÀU THANH XUÂN", bannerUrl: "", topBannerUrl: "", bannerColorClass: "from-[#08a8f9] to-[#1746cb]" },
            admin: { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP 12C1", classAvatarUrl: "" },
            tasks: [], 
            journeys: [],
            settings: { sidebarPosition: 'left', deductStarsOnRedeem: true },
            settingsTab: 'thong-tin',
            students: [], // Đã thêm khởi tạo mảng học sinh để tránh lỗi
            groups: [
                { id: "g1", name: "Tổ 1", color: "text-red-500", avatarUrl: "" },
                { id: "g2", name: "Tổ 2", color: "text-green-500", avatarUrl: "" },
                { id: "g3", name: "Tổ 3", color: "text-yellow-500", avatarUrl: "" },
                { id: "g4", name: "Tổ 4", color: "text-blueAccent", avatarUrl: "" }
            ],
            rewards: [],
            attendanceRecords: {},
            attendanceTab: 'diem-danh',
            
            // --- Cập nhật State cho form Tích điểm mới ---
            pointsForm: {
                actionType: 'add', // 'add' or 'subtract'
                targetType: 'student', // 'student', 'group', or 'class'
                selectedTargetId: '', // student id or group name, empty if class
                selectedTargetIds: [],
                pointsVal: 0,
                category: 'Học tập',
                reason: '',
                note: ''
            },
            
            selectedStudentForRewards: null,
            editingStudentId: null,
            editingGroupId: null,
            criteria: null
        };

       let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = false;
        let isDataLoaded = false;

        // --- BỔ SUNG CÁC HÀM XỬ LÝ NGÀY THÁNG BỊ THIẾU ---
        const _d = new Date();
        let currentAttendanceDate = `${_d.getFullYear()}-${String(_d.getMonth() + 1).padStart(2, '0')}-${String(_d.getDate()).padStart(2, '0')}`;
        
        window.formatDateForDisplay = function(dStr) { 
            if(!dStr) return '';
            return dStr.split('-').reverse().join('/'); 
        };

        window.getTodayString = function() {
            const date = new Date();
            return `${String(date.getDate()).padStart(2, '0')}${String(date.getMonth() + 1).padStart(2, '0')}${date.getFullYear()}`;
        };
        // ------------------------------------------------

        const menuItems = [
            { id: 'tong-quan', icon: 'ph-squares-four', label: 'Trang chủ' },
            { id: 'diem-so', icon: 'ph-read-cv-logo', label: 'KQ học tập' },
            { id: 'hoc-sinh', icon: 'ph-users', label: 'Học sinh' },
            { id: 'thoi-khoa-bieu', icon: 'ph-calendar-list', label: 'Thời khóa biểu' },
            { id: 'so-do-lop', icon: 'ph-grid-four', label: 'Sơ đồ lớp' },
            { id: 'tro-choi', icon: 'ph-game-controller', label: 'Trò chơi' },
            { id: 'nhom-thi-dua', icon: 'ph-flag-pennant', label: 'Tổ thi đua' },
            { id: 'diem-danh', icon: 'ph-calendar-check', label: 'Điểm danh' },
            { id: 'lich-bao-giang', icon: 'ph-notebook', label: 'Lịch báo giảng' },
           { id: 'xep-hang', icon: 'ph-trophy', label: 'Tuyên Dương' },
            { id: 'ke-hoach', icon: 'ph-calendar-star', label: 'Kế hoạch tuần' }, // <--- THÊM DÒNG NÀY
            { id: 'bao-cao', icon: 'ph-chart-bar', label: 'Sổ theo dõi' },
            { id: 'tram-dong-hanh', icon: 'ph-hands-clapping', label: 'Trạm đồng hành' },
            { id: 'cai-dat', icon: 'ph-gear', label: 'Cài đặt' }
        ];

        const navigationGroups = [
            { label: 'Trang chủ', icon: 'ph-squares-four', items: [{ id: 'tong-quan', label: 'Trang chủ' }] },
            { label: 'Học sinh', icon: 'ph-users', items: [{ id: 'hoc-sinh', label: 'Danh sách hồ sơ' }, { id: 'so-do-lop', label: 'Sơ đồ lớp' }] },
            { label: 'Thời khóa biểu', icon: 'ph-calendar-list', items: [{ id: 'thoi-khoa-bieu', label: 'Thời khóa biểu' }] },
            { label: 'KQ học tập', icon: 'ph-read-cv-logo', items: [{ id: 'diem-so', label: 'KQ học tập' }] },
            { label: 'KQ rèn luyện', icon: 'ph-chart-bar', items: [{ id: 'bao-cao', label: 'KQ rèn luyện' }] },
            { label: 'Sổ theo dõi', icon: 'ph-notebook', items: [
                { id: 'diem-danh', label: 'Điểm danh' },
                { id: 'tich-diem', label: 'Theo dõi cá nhân' },
                { id: 'nhom-thi-dua', label: 'Tổ thi đua' },
                { id: 'xep-hang', label: 'Tuyên dương' }
            ] },
            { label: 'Trò chơi', icon: 'ph-game-controller', items: [
                { id: 'tro-choi', label: 'Trò chơi' },
                { id: 'doi-qua', label: 'Đổi quà' },
                { id: 'vong-quay', label: 'Vòng quay' },
                { id: 'dong-ho', label: 'Công cụ', action: 'openTimerDrawer()' }
            ] },
            { label: 'Khác', icon: 'ph-dots-three', items: [
                { id: 'lich-bao-giang', label: 'Lịch báo giảng' },
                { id: 'ke-hoach', label: 'Kế hoạch tuần' },
                { id: 'tram-dong-hanh', label: 'Trạm đồng hành' },
                { id: 'cai-dat', label: 'Cài đặt' }
            ] }
        ];

        function getNavigationGroups() {
            const role = state.auth && state.auth.role;
            const allowedByRole = {
                hocsinh: ['tong-quan', 'hoc-sinh', 'so-do-lop', 'thoi-khoa-bieu', 'diem-so', 'bao-cao', 'diem-danh'],
                bcs: ['tong-quan', 'diem-so', 'hoc-sinh', 'so-do-lop', 'thoi-khoa-bieu', 'diem-danh'],
                bgh: ['tong-quan', 'hoc-sinh', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh']
            };
            const allowed = allowedByRole[role];
            return navigationGroups.map(group => ({
                ...group,
                items: group.items.filter(item => !allowed || allowed.includes(item.id))
            })).filter(group => group.items.length);
        }

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        function escapeHtmlText(str) { return String(str ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }

        window.getStudentDisplayName = function(student) {
            return escapeHtmlText(student && student.name ? student.name : 'Học sinh');
        };
        
        function generateUniqueCode() {
            let code, attempts = 0;
            const currentStudents = state.students || [];
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8, onError = null) {
            const reportError = error => {
                if (typeof onError === 'function') onError(error);
                else console.error('Không thể xử lý ảnh:', error);
            };
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        reportError(new Error('Không thể xử lý ảnh trên trình duyệt này.'));
                        return;
                    }
                    ctx.drawImage(img, 0, 0, width, height);
                    try {
                        callback(canvas.toDataURL('image/jpeg', quality));
                    } catch (error) {
                        if (typeof onError === 'function') reportError(error);
                        else throw error;
                    }
                };
                img.onerror = function() {
                    reportError(new Error('Tệp ảnh không hợp lệ hoặc không thể mở.'));
                };
                img.src = event.target.result;
            };
            reader.onerror = function() {
                reportError(new Error('Không thể đọc tệp ảnh.'));
            };
            try {
                reader.readAsDataURL(file);
            } catch (error) {
                reportError(error);
            }
        }

        function normalizeAccountRole(role) {
            const normalized = String(role || '').trim().toLowerCase();
            if (['bcs', 'ban-can-su', 'ban cán sự', 'ban_cán_sự'].includes(normalized)) return 'bcs';
            if (['student', 'hoc-sinh', 'hocsinh', 'phhs'].includes(normalized)) return 'hocsinh';
            if (['bgh', 'ban-giam-hieu', 'ban_giam_hieu'].includes(normalized)) return 'gvcn';
            return normalized || 'gvcn';
        }

        function getBcsLinkedStudent() {
            if (!state.auth || state.auth.role !== 'bcs') return null;
            const account = (state.users || []).find(user => String(user.id) === String(state.auth.userId));
            return account ? state.students.find(student => String(student.id) === String(account.studentId)) || null : null;
        }

        function isAttendanceLeader() {
            if (state.auth && state.auth.role === 'gvcn') return true;
            if (!state.auth || state.auth.role !== 'bcs') return false;
            const role = String(getBcsLinkedStudent() && getBcsLinkedStudent().role || '').toLocaleLowerCase('vi');
            return role.includes('lớp trưởng') || role.includes('tổ trưởng');
        }

        function getAttendanceScopeStudents() {
            if (!state.auth || !state.auth.loggedIn) return [];
            if (state.auth.role === 'gvcn') return state.students || [];
            const linkedStudent = state.auth.role === 'bcs' ? getBcsLinkedStudent() : null;
            const linkedId = String(state.auth.studentId || linkedStudent && linkedStudent.id || '');
            if (state.auth.role === 'bcs' && linkedStudent) {
                const role = String(linkedStudent.role || '').toLocaleLowerCase('vi');
                if (role.includes('lớp trưởng')) return state.students || [];
                if (role.includes('tổ trưởng') && linkedStudent.group) {
                    return (state.students || []).filter(student =>
                        String(student.group || '').trim() === String(linkedStudent.group).trim()
                    );
                }
            }
            return (state.students || []).filter(student => String(student.id) === linkedId);
        }

        function canManageAttendanceStudent(studentId) {
            if (!state.auth || !state.auth.loggedIn) return false;
            if (state.auth.role === 'gvcn' || isAttendanceLeader()) {
                return getAttendanceScopeStudents().some(student => String(student.id) === String(studentId));
            }
            return String(state.auth.studentId || '') === String(studentId);
        }

        function getReminderEligibleStudents() {
            if (state.auth && state.auth.role === 'gvcn') return state.students || [];
            if (!state.auth || state.auth.role !== 'bcs') return [];
            const leader = getBcsLinkedStudent();
            const role = String(leader && leader.role || '').toLocaleLowerCase('vi');
            if (role.includes('lớp trưởng')) return state.students || [];
            if (role.includes('tổ trưởng') && leader.group) {
                return (state.students || []).filter(student =>
                    String(student.group || '').trim() === String(leader.group).trim()
                );
            }
            return [];
        }

        function renderClassReminders() {
            const role = state.auth && state.auth.role;
            const eligibleStudents = getReminderEligibleStudents();
            const canSend = role === 'gvcn' || (role === 'bcs' && eligibleStudents.length > 0);
            const reminders = (state.classReminders || []).map(reminder => {
                const recipientIds = Array.isArray(reminder.recipient_ids) ? reminder.recipient_ids.map(String) : [];
                const allStudentsIncluded = (state.students || []).length > 0 &&
                    (state.students || []).every(student => recipientIds.includes(String(student.id)));
                const recipients = allStudentsIncluded
                    ? 'Cả lớp'
                    : recipientIds.map(id => (state.students || []).find(student => String(student.id) === id)?.name).filter(Boolean).join(', ');
                const date = reminder.created_at
                    ? new Date(reminder.created_at).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' })
                    : '';
                return `<article class="rounded-2xl border border-indigo-100 bg-white p-4 shadow-sm">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">
                        <span class="font-black text-indigo-800">${escapeHtmlText(reminder.sender_role === 'GVCN' || reminder.sender_name === 'GVCN' ? 'Giáo viên chủ nhiệm' : reminder.sender_name || 'Giáo viên chủ nhiệm')}</span>
                        ${reminder.sender_role && reminder.sender_role !== 'GVCN' ? `<span class="rounded-full bg-indigo-50 px-2.5 py-1 font-bold text-indigo-700">${escapeHtmlText(reminder.sender_role)}</span>` : ''}
                        <span class="ml-auto text-slate-400">${escapeHtmlText(date)}</span>
                    </div>
                    <p class="mt-3 whitespace-pre-wrap break-words text-sm font-semibold leading-relaxed text-slate-700">${escapeHtmlText(reminder.message || '')}</p>
                    <div class="mt-3 flex items-center gap-1.5 text-[11px] font-bold text-slate-400"><i class="ph-fill ph-users"></i>${escapeHtmlText(recipients || 'Người nhận')}</div>
                    ${role === 'gvcn' ? `<div class="mt-3 flex flex-wrap gap-2"><button type="button" onclick="editClassReminder('${escapeHtmlAttr(reminder.id)}')" class="inline-flex items-center gap-1 rounded-lg bg-indigo-50 px-3 py-1.5 text-xs font-black text-indigo-700 hover:bg-indigo-100"><i class="ph-bold ph-pencil-simple"></i>Sửa lời nhắc</button><button type="button" onclick="deleteClassReminder('${escapeHtmlAttr(reminder.id)}')" class="inline-flex items-center gap-1 rounded-lg bg-rose-50 px-3 py-1.5 text-xs font-black text-rose-700 hover:bg-rose-100"><i class="ph-bold ph-trash"></i>Xóa lời nhắc</button></div>` : ''}
                </article>`;
            }).join('');
            const recipientGroups = [...new Set(eligibleStudents.map(student => String(student.group || '').trim()).filter(Boolean))];
            const recipientsHtml = eligibleStudents.map(student => `
                <label data-reminder-group="${escapeHtmlAttr(student.group || '')}" class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 transition hover:border-indigo-300 hover:bg-indigo-50">
                    <input type="checkbox" data-reminder-recipient value="${escapeHtmlAttr(student.id)}" onchange="updateReminderAllState()" class="h-4 w-4 accent-indigo-600">
                    <span class="truncate">${getStudentDisplayName(student)}<span class="ml-1 font-medium text-slate-400">${escapeHtmlText(student.group || '')}</span></span>
                </label>`).join('');
            const senderStudent = role === 'bcs' ? getBcsLinkedStudent() : null;
            const recipientScope = role === 'bcs' && String(senderStudent && senderStudent.role || '').toLocaleLowerCase('vi').includes('tổ trưởng')
                ? escapeHtmlText(senderStudent.group || 'tổ của mình')
                : 'toàn lớp';

            return `<section class="overflow-hidden rounded-[1.75rem] border border-indigo-100 bg-gradient-to-br from-indigo-50 via-white to-sky-50 shadow-sm">
                <div class="flex flex-col gap-3 border-b border-indigo-100 px-5 py-5 sm:flex-row sm:items-center sm:justify-between md:px-7">
                    <div class="flex items-start gap-3">
                        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-md shadow-indigo-200"><i class="ph-fill ph-bell-ringing text-xl"></i></div>
                        <div><h3 class="text-lg font-black text-slate-800">Lời nhắc của lớp</h3><p class="mt-0.5 text-xs font-medium text-slate-500">Thông báo dành cho đúng người nhận</p></div>
                    </div>
                    ${canSend ? `<span class="w-fit rounded-full bg-white px-3 py-1.5 text-[11px] font-black text-indigo-700 shadow-sm"><i class="ph-fill ph-shield-check mr-1"></i>${role === 'gvcn' ? 'GVCN · toàn lớp hoặc từng bạn' : `${escapeHtmlText(senderStudent.role)} · ${recipientScope}`}</span>` : ''}
                </div>
                <div class="grid gap-5 p-5 md:grid-cols-[minmax(0,1fr)_minmax(260px,0.85fr)] md:p-7">
                    ${canSend ? `<form onsubmit="sendClassReminder(event)" class="space-y-4">
                        <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-wide text-slate-500">Nội dung lời nhắc</span>
                            <textarea id="class-reminder-message" maxlength="500" required rows="3" placeholder="Ví dụ: Cả lớp nhớ nộp bài trước 17:00 nhé!" class="w-full resize-y rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 outline-none transition placeholder:font-medium placeholder:text-slate-300 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100"></textarea>
                        </label>
                        <div>
                            <div class="mb-2 flex items-center justify-between gap-2"><span class="text-xs font-black uppercase tracking-wide text-slate-500">Người nhận</span><span class="text-[11px] font-semibold text-slate-400">Chọn tất cả hoặc từng bạn</span></div>
                            <label class="mb-2 block text-xs font-bold text-slate-600">Chọn tổ để lọc thành viên
                                <select id="class-reminder-group" onchange="filterReminderRecipients(this.value)" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700">
                                    <option value="">Tất cả các tổ</option>
                                    ${recipientGroups.map(group => `<option value="${escapeHtmlAttr(group)}">${escapeHtmlText(group)}</option>`).join('')}
                                </select>
                            </label>
                            <label class="mb-2 flex cursor-pointer items-center gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-2.5 text-xs font-black text-indigo-800">
                                <input id="class-reminder-all" type="checkbox" onchange="toggleReminderRecipients(this.checked)" class="h-4 w-4 accent-indigo-600"> ${role === 'bcs' && senderStudent && !String(senderStudent.role || '').toLocaleLowerCase('vi').includes('lớp trưởng') ? `Cả ${recipientScope}` : 'Cả lớp'}
                            </label>
                            <div class="grid max-h-40 grid-cols-1 gap-2 overflow-y-auto pr-1 sm:grid-cols-2">${recipientsHtml || '<p class="text-xs font-semibold text-amber-700">Chưa có học sinh phù hợp để chọn.</p>'}</div>
                        </div>
                        <button type="submit" class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-black text-white shadow-md shadow-indigo-200 transition hover:-translate-y-0.5 hover:bg-indigo-700"><i class="ph-fill ph-paper-plane-tilt"></i> Gửi lời nhắc</button>
                    </form>` : `<div class="flex min-h-32 items-center rounded-2xl border border-slate-100 bg-white/80 p-4 text-sm font-medium leading-relaxed text-slate-500">
                        ${role === 'bcs' ? 'Quyền gửi lời nhắc dành cho lớp trưởng và tổ trưởng. Bạn chỉ xem được lời nhắc gửi đến mình.' : 'Bạn chỉ xem được những lời nhắc dành cho mình.'}
                    </div>`}
                    <div class="space-y-3">
                        <div class="flex items-center justify-between"><h4 class="text-xs font-black uppercase tracking-wide text-slate-500">Lời nhắc gần đây</h4><button type="button" onclick="refreshClassReminders()" class="rounded-lg p-2 text-indigo-500 transition hover:bg-indigo-100" title="Tải lại"><i class="ph-bold ph-arrow-clockwise"></i></button></div>
                        <div class="max-h-80 space-y-3 overflow-y-auto pr-1">${reminders || '<div class="rounded-2xl border border-dashed border-slate-200 bg-white/70 px-4 py-8 text-center text-xs font-semibold text-slate-400"><i class="ph-fill ph-chat-circle-dots mb-2 block text-2xl text-indigo-200"></i>Chưa có lời nhắc nào.</div>'}</div>
                    </div>
                </div>
            </section>`;
        }

        function toggleReminderRecipients(checked) {
            const groupFilter = document.getElementById('class-reminder-group')?.value || '';
            document.querySelectorAll('[data-reminder-recipient]').forEach(input => {
                if (input.closest('[data-reminder-group]')?.dataset.reminderGroup === groupFilter || !groupFilter) {
                    input.checked = checked;
                }
            });
            updateReminderAllState();
        }

        function filterReminderRecipients(group) {
            document.querySelectorAll('[data-reminder-recipient]').forEach(input => {
                const label = input.closest('[data-reminder-group]');
                if (label) label.classList.toggle('hidden', Boolean(group) && label.dataset.reminderGroup !== group);
            });
            updateReminderAllState();
        }

        function updateReminderAllState() {
            const recipients = [...document.querySelectorAll('[data-reminder-recipient]')].filter(input => !input.closest('[data-reminder-group]')?.classList.contains('hidden'));
            const all = document.getElementById('class-reminder-all');
            if (all) all.checked = recipients.length > 0 && recipients.every(input => input.checked);
        }

        window.loadClassReminders = async function() {
            const client = await window.cloudReady;
            const { data, error } = await client.from('class_reminders')
                .select('*')
                .order('created_at', { ascending: false })
                .order('id', { ascending: false })
                .limit(50);
            if (error) throw error;
            state.classReminders = data || [];
        };

        window.startClassReminderSync = function() {
            if (window.classReminderSyncInterval) clearInterval(window.classReminderSyncInterval);
            if (!state.auth || !state.auth.loggedIn || state.auth.role === 'gvcn') return;
            window.classReminderSyncInterval = setInterval(async () => {
                try {
                    const previous = JSON.stringify(state.classReminders || []);
                    await window.loadClassReminders();
                    window.classReminderSyncErrorShown = false;
                    const changed = previous !== JSON.stringify(state.classReminders || []);
                    if (changed) {
                        window.notifyNewClassReminders();
                        if (state.currentTab === 'tong-quan' || state.showReminderNotifications) renderLayout();
                        else updateClassReminderNotificationControl();
                    }
                } catch (error) {
                    console.error('Không thể đồng bộ lời nhắc của lớp:', error);
                    if (!window.classReminderSyncErrorShown) {
                        window.classReminderSyncErrorShown = true;
                        showToast(error.message || 'Không thể đồng bộ lời nhắc của lớp.', 'error');
                    }
                }
            }, 10000);
        };

        window.notifyNewClassReminders = function() {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return;
            const readKey = `classReminderSeen:${userId}`;
            const notifiedKey = `classReminderNotified:${userId}`;
            let readIds = [];
            let notifiedIds = [];
            try {
                readIds = JSON.parse(localStorage.getItem(readKey) || '[]');
                if (!Array.isArray(readIds)) readIds = [];
            } catch (error) {
                console.error('Không thể đọc trạng thái thông báo lời nhắc:', error);
            }
            try {
                notifiedIds = JSON.parse(sessionStorage.getItem(notifiedKey) || '[]');
                if (!Array.isArray(notifiedIds)) notifiedIds = [];
            } catch (error) {
                console.error('Không thể đọc trạng thái thông báo trong phiên:', error);
            }
            const read = new Set(readIds.map(String));
            const notified = new Set(notifiedIds.map(String));
            const reminders = state.classReminders || [];
            const unread = reminders.filter(reminder => !read.has(String(reminder.id)) && String(reminder.created_by || '') !== userId);
            const fresh = unread.filter(reminder => !notified.has(String(reminder.id)));
            if (!fresh.length) return;
            const allNotifiedIds = [...new Set([...notifiedIds.map(String), ...fresh.map(reminder => String(reminder.id))])].slice(-100);
            try {
                sessionStorage.setItem(notifiedKey, JSON.stringify(allNotifiedIds));
            } catch (error) {
                console.error('Không thể lưu trạng thái thông báo trong phiên:', error);
            }
            const latest = fresh[0];
            const sender = latest.sender_role === 'GVCN' || latest.sender_name === 'GVCN'
                ? 'Giáo viên chủ nhiệm'
                : latest.sender_name || latest.sender_role || 'Ban cán sự';
            const message = String(latest.message || '').slice(0, 100);
            showToast(
                `Bạn có ${fresh.length} lời nhắc mới từ ${escapeHtmlText(sender)}: “${escapeHtmlText(message)}${String(latest.message || '').length > 100 ? '…' : ''}”`,
                'success'
            );
        };

        function getUnreadClassReminderCount() {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return 0;
            try {
                const readIds = JSON.parse(localStorage.getItem(`classReminderSeen:${userId}`) || '[]');
                const read = new Set(Array.isArray(readIds) ? readIds.map(String) : []);
                return (state.classReminders || []).filter(reminder =>
                    !read.has(String(reminder.id)) && String(reminder.created_by || '') !== userId
                ).length;
            } catch (error) {
                console.error('Không thể đếm lời nhắc chưa đọc:', error);
                return 0;
            }
        }

        function isClassReminderUnread(reminder) {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId || String(reminder.created_by || '') === userId) return false;
            try {
                const readIds = JSON.parse(localStorage.getItem(`classReminderSeen:${userId}`) || '[]');
                return !(Array.isArray(readIds) ? readIds.map(String) : []).includes(String(reminder.id));
            } catch (error) {
                console.error('Không thể đọc trạng thái lời nhắc:', error);
                return true;
            }
        }

        function getVisibleTimetableReminders() {
            return getTimetableReminderEntries()
                .filter(reminder => String(reminder.message || '').trim())
                .sort((left, right) => `${right.date} ${right.time || ''}`.localeCompare(`${left.date} ${left.time || ''}`));
        }

        function getSeenTimetableReminderIds() {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return new Set();
            try {
                const ids = JSON.parse(localStorage.getItem(`timetableReminderSeen:${userId}`) || '[]');
                return new Set(Array.isArray(ids) ? ids.map(String) : []);
            } catch (error) {
                console.error('Không thể đọc trạng thái lời nhắc thời khóa biểu:', error);
                return new Set();
            }
        }

        function isTimetableReminderUnread(reminder) {
            return !getSeenTimetableReminderIds().has(String(reminder.id));
        }

        function getUnreadTimetableReminderCount() {
            return getVisibleTimetableReminders().filter(isTimetableReminderUnread).length;
        }

        window.markTimetableReminderRead = function(reminderId) {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return;
            if (!getVisibleTimetableReminders().some(reminder => String(reminder.id) === String(reminderId))) return;
            try {
                const key = `timetableReminderSeen:${userId}`;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                const seen = new Set(Array.isArray(existing) ? existing.map(String) : []);
                seen.add(String(reminderId));
                localStorage.setItem(key, JSON.stringify([...seen].slice(-200)));
            } catch (error) {
                console.error('Không thể đánh dấu lời nhắc thời khóa biểu đã đọc:', error);
                showToast('Không lưu được trạng thái đã đọc lời nhắc.', 'error');
            }
            updateClassReminderNotificationControl();
        };

        window.openClassReminderNotifications = function() {
            state.showReminderNotifications = true;
            markAllNotificationsRead();
            updateClassReminderNotificationControl();
        };

        function markAllNotificationsRead() {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return;
            try {
                const classKey = `classReminderSeen:${userId}`;
                const existingClassIds = JSON.parse(localStorage.getItem(classKey) || '[]');
                const classIds = new Set(Array.isArray(existingClassIds) ? existingClassIds.map(String) : []);
                (state.classReminders || []).forEach(reminder => {
                    if (String(reminder.created_by || '') !== userId) classIds.add(String(reminder.id));
                });
                localStorage.setItem(classKey, JSON.stringify([...classIds].slice(-100)));

                const timetableKey = `timetableReminderSeen:${userId}`;
                const existingTimetableIds = JSON.parse(localStorage.getItem(timetableKey) || '[]');
                const timetableIds = new Set(Array.isArray(existingTimetableIds) ? existingTimetableIds.map(String) : []);
                getVisibleTimetableReminders().forEach(reminder => timetableIds.add(String(reminder.id)));
                localStorage.setItem(timetableKey, JSON.stringify([...timetableIds].slice(-200)));
            } catch (error) {
                console.error('Không thể đánh dấu tất cả thông báo đã đọc:', error);
                showToast('Không lưu được trạng thái thông báo đã xem.', 'error');
            }
        }

        window.closeClassReminderNotifications = function() {
            state.showReminderNotifications = false;
            updateClassReminderNotificationControl();
        };

        window.markClassReminderRead = function(reminderId) {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId) return;
            const reminder = (state.classReminders || []).find(item => String(item.id) === String(reminderId));
            if (!reminder || String(reminder.created_by || '') === userId) return;
            try {
                const key = `classReminderSeen:${userId}`;
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                const read = new Set(Array.isArray(existing) ? existing.map(String) : []);
                read.add(String(reminder.id));
                localStorage.setItem(key, JSON.stringify([...read].slice(-100)));
            } catch (error) {
                console.error('Không thể đánh dấu lời nhắc đã đọc:', error);
                showToast('Không lưu được trạng thái đã đọc lời nhắc.', 'error');
            }
            updateClassReminderNotificationControl();
        };

        function updateClassReminderNotificationControl() {
            const control = document.getElementById('class-reminder-notification-control');
            if (control) control.outerHTML = renderClassReminderNotifications();
        };

        function notifyNewTimetableReminders() {
            const userId = String(state.auth && state.auth.userId || '');
            if (!userId || state.auth.role === 'gvcn') return;
            const reminders = getVisibleTimetableReminders();
            const key = `timetableReminderNotified:${userId}`;
            try {
                const stored = sessionStorage.getItem(key);
                const knownIds = new Set(stored ? JSON.parse(stored).map(String) : []);
                const seenIds = getSeenTimetableReminderIds();
                const fresh = reminders.filter(reminder =>
                    !knownIds.has(String(reminder.id)) && !seenIds.has(String(reminder.id))
                );
                sessionStorage.setItem(key, JSON.stringify([...new Set([...knownIds, ...reminders.map(reminder => String(reminder.id))])].slice(-200)));
                if (fresh.length) {
                    const latest = fresh[0];
                    showToast(`Có ${fresh.length} lời nhắc thời khóa biểu mới: ${escapeHtmlText(latest.subject || 'môn học')} · ${escapeHtmlText(formatTimetableDate(latest.date))} ${escapeHtmlText(latest.time || '')} — ${escapeHtmlText(latest.message || '')}`, 'success');
                }
            } catch (error) {
                console.error('Không thể theo dõi lời nhắc thời khóa biểu mới:', error);
                showToast('Không thể cập nhật trạng thái thông báo thời khóa biểu.', 'error');
            }
        }

        window.refreshTimetableReminderState = async function(notify = true) {
            if (!state.auth || !state.auth.loggedIn || state.auth.role === 'gvcn' || !state.cloudProfile) return;
            const client = await window.cloudReady;
            const { data, error } = await client
                .from('class_data')
                .select('state')
                .eq('class_id', state.cloudProfile.class_id)
                .maybeSingle();
            if (error) throw error;
            window.timetableReminderSyncErrorShown = false;
            const reminders = data && data.state && data.state.timetableReminders;
            const nextReminders = reminders && typeof reminders === 'object' && !Array.isArray(reminders) ? reminders : {};
            const changed = JSON.stringify(nextReminders) !== JSON.stringify(state.timetableReminders || {});
            state.timetableReminders = nextReminders;
            if (changed) {
                if (state.currentTab === 'thoi-khoa-bieu') renderLayout();
                else updateClassReminderNotificationControl();
            }
            if (notify) notifyNewTimetableReminders();
        };

        window.startTimetableReminderSync = function() {
            if (!state.auth || state.auth.role === 'gvcn') return;
            const refresh = () => window.refreshTimetableReminderState(true).catch(error => {
                console.error('Không thể đồng bộ lời nhắc thời khóa biểu:', error);
                if (!window.timetableReminderSyncErrorShown) {
                    window.timetableReminderSyncErrorShown = true;
                    showToast(error.message || 'Không thể đồng bộ lời nhắc thời khóa biểu.', 'error');
                }
            });
            refresh();
            if (!window.timetableReminderSyncInterval) {
                window.timetableReminderSyncInterval = setInterval(refresh, 10000);
            }
        };

        function renderClassReminderNotifications() {
            if (!state.auth || !state.auth.loggedIn) return '';
            const timetableReminders = getVisibleTimetableReminders();
            const unreadCount = getUnreadClassReminderCount() + getUnreadTimetableReminderCount();
            const reminders = (state.classReminders || []).slice(0, 20);
            const renderClassItems = (items) => items.map(reminder => {
                const sender = reminder.sender_role === 'GVCN' || reminder.sender_name === 'GVCN'
                    ? 'Giáo viên chủ nhiệm'
                    : reminder.sender_name || reminder.sender_role || 'Ban cán sự';
                const date = reminder.created_at
                    ? new Date(reminder.created_at).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' })
                    : '';
                const unread = isClassReminderUnread(reminder);
                return `<button type="button" onclick="markClassReminderRead('${escapeHtmlAttr(reminder.id)}')" class="block w-full rounded-xl border ${unread ? 'border-indigo-200 bg-indigo-50/70' : 'border-slate-100 bg-white'} p-3 text-left transition hover:border-indigo-300 hover:shadow-sm">
                    <span class="flex items-center gap-2"><span class="text-xs font-black text-indigo-800">${escapeHtmlText(sender)}</span>${unread ? '<span class="h-2 w-2 rounded-full bg-indigo-500"></span>' : ''}<span class="ml-auto text-[10px] text-slate-400">${escapeHtmlText(date)}</span></span>
                    <span class="mt-2 block whitespace-pre-wrap break-words text-xs font-semibold leading-relaxed text-slate-700">${escapeHtmlText(reminder.message || '')}</span>
                </button>`;
            }).join('');
            const renderTimetableItems = (items) => items.map(reminder => {
                const unread = isTimetableReminderUnread(reminder);
                const date = `${formatTimetableDate(reminder.date)} · ${reminder.time || '--:--'}`;
                const details = `${reminder.subject || 'Môn học'} · ${reminder.period || 'Tiết học'}${reminder.session ? ` · ${reminder.session}` : ''}`;
                return `<button type="button" onclick="markTimetableReminderRead('${escapeHtmlAttr(reminder.id)}')" class="block w-full rounded-xl border ${unread ? 'border-amber-200 bg-amber-50/70' : 'border-slate-100 bg-white'} p-3 text-left transition hover:border-amber-300 hover:shadow-sm">
                    <span class="flex items-center gap-2"><span class="text-xs font-black text-amber-900">Lời nhắc thời khóa biểu</span>${unread ? '<span class="h-2 w-2 rounded-full bg-rose-500"></span>' : ''}<span class="ml-auto text-[10px] text-slate-400">${escapeHtmlText(date)}</span></span>
                    <span class="mt-1 block text-[10px] font-bold text-slate-500">${escapeHtmlText(details)}</span>
                    <span class="mt-2 block whitespace-pre-wrap break-words text-xs font-semibold leading-relaxed text-slate-700">${escapeHtmlText(reminder.message || '')}</span>
                </button>`;
            }).join('');
            const newClassReminders = reminders.filter(isClassReminderUnread);
            const oldClassReminders = reminders.filter(reminder => !isClassReminderUnread(reminder));
            const newTimetableReminders = timetableReminders.filter(isTimetableReminderUnread);
            const oldTimetableReminders = timetableReminders.filter(reminder => !isTimetableReminderUnread(reminder));
            const newItems = `${renderClassItems(newClassReminders)}${renderTimetableItems(newTimetableReminders)}`;
            const oldItems = `${renderClassItems(oldClassReminders)}${renderTimetableItems(oldTimetableReminders)}`;
            return `<div id="class-reminder-notification-control" class="relative">
                <button type="button" onclick="openClassReminderNotifications()" aria-label="Thông báo lời nhắc${unreadCount ? `, ${unreadCount} chưa đọc` : ''}" class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-white transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-200">
                    <i class="ph-fill ph-bell-ringing text-xl"></i>
                    ${unreadCount ? `<span class="absolute -right-1 -top-1 flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[#064e3b] bg-rose-500 px-1 text-[9px] font-black text-white">${unreadCount > 99 ? '99+' : unreadCount}</span>` : ''}
                </button>
                ${state.showReminderNotifications ? `<div class="absolute right-0 top-12 z-[60] w-[min(24rem,calc(100vw-2rem))] overflow-hidden rounded-2xl border border-slate-200 bg-white text-slate-800 shadow-2xl">
                    <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3"><div><h3 class="text-sm font-black">Thông báo lời nhắc</h3><p class="text-[10px] font-semibold text-slate-400">${unreadCount ? `${unreadCount} lời nhắc chưa đọc` : 'Bạn đã xem tất cả'}</p></div><button type="button" onclick="closeClassReminderNotifications()" aria-label="Đóng thông báo" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700"><i class="ph-bold ph-x"></i></button></div>
                    <div class="max-h-80 space-y-3 overflow-y-auto bg-slate-50/70 p-3">
                        <section><h4 class="mb-2 text-[11px] font-black uppercase tracking-wide text-indigo-700">Thông báo mới (${newClassReminders.length + newTimetableReminders.length})</h4><div class="space-y-2">${newItems || '<p class="rounded-xl bg-white p-3 text-xs font-semibold text-slate-400">Không có thông báo mới.</p>'}</div></section>
                        <section><h4 class="mb-2 text-[11px] font-black uppercase tracking-wide text-slate-500">Thông báo cũ (${oldClassReminders.length + oldTimetableReminders.length})</h4><div class="space-y-2">${oldItems || '<p class="rounded-xl bg-white p-3 text-xs font-semibold text-slate-400">Chưa có thông báo cũ.</p>'}</div></section>
                    </div>
                </div>` : ''}
            </div>`;
        }

        window.refreshClassReminders = async function() {
            try {
                await window.loadClassReminders();
                renderLayout();
            } catch (error) {

            const message = String(document.getElementById('class-reminder-message')?.value || '').trim();
            const recipientIds = [...document.querySelectorAll('[data-reminder-recipient]:checked')].map(input => input.value);
            if (!message || !recipientIds.length) {
                showToast('Hãy nhập nội dung và chọn ít nhất một người nhận.', 'error');
                return;
            }
            try {
                await window.cloudReminderRequest({ message, recipientIds });
                await window.loadClassReminders();
                renderLayout();
                showToast('Đã gửi lời nhắc.', 'success');
            } catch (error) {
                console.error('Không thể gửi lời nhắc:', error);
                showToast(error.message || 'Không thể gửi lời nhắc.', 'error');

                showToast('Chỉ GVCN mới được sửa lời nhắc.', 'error');
                return;
            }
            const reminder = (state.classReminders || []).find(item => String(item.id) === String(reminderId));
            if (!reminder) return showToast('Không tìm thấy lời nhắc cần sửa.', 'error');
            const message = prompt('Sửa nội dung lời nhắc (tối đa 500 ký tự):', reminder.message || '');
            if (message === null) return;
            const normalizedMessage = message.trim();
            if (!normalizedMessage || normalizedMessage.length > 500) {
                showToast('Nội dung lời nhắc phải có từ 1 đến 500 ký tự.', 'error');
                return;
            }
            try {
                await window.cloudReminderRequest({ id: reminderId, message: normalizedMessage }, 'PUT');
                await window.loadClassReminders();
                renderLayout();
                showToast('Đã cập nhật lời nhắc.', 'success');
            } catch (error) {
                console.error('Không thể sửa lời nhắc:', error);

    function getHomeWeekStart(dateValue) {
        const date = new Date(`${dateValue}T00:00:00`);
        date.setDate(date.getDate() - (date.getDay() === 0 ? 6 : date.getDay() - 1));
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function getHomeWeekEnd(weekStart) {
        const date = new Date(`${weekStart}T00:00:00`);
        date.setDate(date.getDate() + 5);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function getPlainWeekTopic(value) {
        const container = document.createElement('div');
        container.innerHTML = String(value || '');
        return container.textContent.trim();
    }

    window.selectHomeWeekDate = function(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
        const date = new Date(`${value}T00:00:00`);
        const normalized = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        if (Number.isNaN(date.getTime()) || normalized !== value) {
            showToast('Ngày chọn không hợp lệ.', 'error');
            renderLayout();
            return;
        }
        const weekStart = getHomeWeekStart(value);
        if (!state.theme.weekTopics || typeof state.theme.weekTopics !== 'object' || Array.isArray(state.theme.weekTopics)) {
            state.theme.weekTopics = {};
        }
        const previousWeekStart = state.theme.weekStartDate;
        if (previousWeekStart && !state.theme.weekTopics[previousWeekStart] && state.theme.weekTopic) {
            state.theme.weekTopics[previousWeekStart] = getPlainWeekTopic(state.theme.weekTopic);
        }
        state.theme.weekTopicDate = value;
        state.theme.weekStartDate = weekStart;
        state.theme.weekEndDate = getHomeWeekEnd(weekStart);
        state.theme.weekTitle = `TUẦN ${formatDateForDisplay(weekStart)} ➔ ${formatDateForDisplay(state.theme.weekEndDate)}`;
        state.theme.weekTopic = state.theme.weekTopics[weekStart] || '';
        if (state.auth && state.auth.role === 'gvcn') saveData();
        renderLayout();
    };

    window.shiftHomeWeek = function(offset) {
        const today = new Date();
        const todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const selectedDate = state.theme.weekTopicDate || state.theme.weekStartDate || todayString;
        const weekStart = getHomeWeekStart(selectedDate);
        const date = new Date(`${weekStart}T00:00:00`);
        date.setDate(date.getDate() + (Math.sign(Number(offset) || 0) * 7));
        const value = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        window.selectHomeWeekDate(value);
    };

    window.saveHomeWeekTopic = function(value) {
        if (!state.auth || state.auth.role !== 'gvcn') {
            showToast('Chỉ GVCN mới được sửa chủ đề tuần.', 'error');
            renderLayout();
            return;
        }
        const selectedDate = state.theme.weekTopicDate || state.theme.weekStartDate;
        if (!selectedDate) {
            showToast('Hãy chọn ngày trong tuần trước khi sửa chủ đề.', 'error');
            return;
        }
        const weekStart = getHomeWeekStart(selectedDate);
        if (!state.theme.weekTopics || typeof state.theme.weekTopics !== 'object' || Array.isArray(state.theme.weekTopics)) {
            state.theme.weekTopics = {};
        }
        const topic = String(value || '').trim();
        if (topic) state.theme.weekTopics[weekStart] = topic;
        else delete state.theme.weekTopics[weekStart];
        state.theme.weekTopic = topic;
        state.theme.weekTopicDate = selectedDate;
        state.theme.weekStartDate = weekStart;
        state.theme.weekEndDate = getHomeWeekEnd(weekStart);
        state.theme.weekTitle = `TUẦN ${formatDateForDisplay(weekStart)} ➔ ${formatDateForDisplay(state.theme.weekEndDate)}`;
        saveData();
        renderLayout();
    };

    const d = new Date();
    const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
    const defaultWeekStart = `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
    const saturday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 5);
    const selectedWeekDate = state.theme.weekTopicDate || state.theme.weekStartDate || defaultWeekStart;
    const weekStart = getHomeWeekStart(selectedWeekDate);
    const weekEnd = getHomeWeekEnd(weekStart);
    const legacyTopic = !state.theme.weekTopics && weekStart === state.theme.weekStartDate
        ? getPlainWeekTopic(state.theme.weekTopic)
        : '';
    const weekTopic = state.theme.weekTopics && state.theme.weekTopics[weekStart] || legacyTopic;
    const canEditHome = !!(state.auth && state.auth.role === 'gvcn');
    const todayRecord = state.attendanceRecords[todayStr] || {};
    
    const totalStudents = state.students.length;

    let lateCount = 0;
    let todayPositiveCount = 0;
    let todayNegativeCount = 0;
    let attentionStudents = new Set();

    state.students.forEach(s => {
        // Điểm danh hôm nay
        const status = todayRecord[s.id];
        if (status === 'excused' || status === 'unexcused') {
            absentCount++;
            attentionStudents.add(s.id); // Vắng mặt cần chú ý
        } else if (status === 'late') {
            lateCount++;
            attentionStudents.add(s.id); // Đi trễ cần chú ý
        }

        // Điểm số (khen thưởng/kỷ luật) hôm nay
        if (s.history) {
            s.history.forEach(h => {
                const hDate = h.date ? h.date.split('T')[0] : '';
                if (hDate === todayStr) {
                    if (h.points > 0) todayPositiveCount++; 
                    if (h.points < 0) {
                        todayNegativeCount++; 
                        attentionStudents.add(s.id); // Vi phạm cần chú ý
                    }
                }
            });
        }
    });
    
    const presentStudents = Math.max(0, totalStudents - absentCount);
    const goodPointsCount = todayPositiveCount; 
    const needAttentionCount = attentionStudents.size;

    // Đánh giá Học tập hôm nay (100% trừ đi 5% mỗi lượt vi phạm)
    let learningPercent = 100;
    if (totalStudents > 0) {
        learningPercent = Math.max(0, 100 - (todayNegativeCount * 5));
    } else {

function renderStudentSelfStatistics() {
    const account = (state.users || []).find(user => String(user.id) === String(state.auth && state.auth.userId));
    const student = account && (state.students || []).find(item => String(item.id) === String(account.studentId));
    if (!student) {
        return `
            <div class="max-w-4xl mx-auto rounded-3xl border border-amber-200 bg-amber-50 p-8 text-center">
                <h2 class="text-2xl font-black text-amber-900">Chưa liên kết hồ sơ học sinh</h2>
                <p class="mt-2 text-sm font-medium text-amber-800">Vui lòng liên hệ GVCN để kiểm tra tài khoản và hồ sơ học sinh được liên kết.</p>
            </div>
        `;
    }

    const today = new Date();
    const todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const day = weekStart.getDay();
    weekStart.setDate(weekStart.getDate() - (day === 0 ? 6 : day - 1));
    const weekStartString = `${weekStart.getFullYear()}-${String(weekStart.getMonth() + 1).padStart(2, '0')}-${String(weekStart.getDate()).padStart(2, '0')}`;
    const monthStartString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-01`;
    const attendance = { present: 0, late: 0, excused: 0, unexcused: 0, lateWeek: 0, lateMonth: 0 };

    Object.entries(state.attendanceRecords || {}).forEach(([recordKey, records]) => {
        const date = recordKey.split('_')[0];
        const status = records && records[student.id];
        if (Object.prototype.hasOwnProperty.call(attendance, status)) attendance[status]++;

            const shouldSelect = visible.some(label => !label.querySelector('input').checked);
            visible.forEach(label => {
                const checkbox = label.querySelector('input');
                if (checkbox.checked !== shouldSelect) {
                    checkbox.checked = shouldSelect;
                    window.togglePointsStudent(checkbox.value, shouldSelect);
                }
            });
        };

      window.executeQuickPoint = function(studentId, points, reason, category, type) {
    const student = state.students.find(s => String(s.id) === String(studentId));
    if (!student) return;
    if (!state.auth || !['gvcn', 'bcs'].includes(state.auth.role) || !['add', 'subtract'].includes(type) || (state.auth.role === 'bcs' && type !== 'subtract')) {
        return showToast('Bạn không có quyền thực hiện thao tác này.', 'error');
    }
    if (!canBcsManageStudent(student)) return showToast('Bạn không có quyền quản lý học sinh này.', 'error');
    if (!String(reason || '').trim()) return showToast('Vui lòng nhập lý do trước khi ghi điểm.', 'error');
    const amount = Number(points);
    if (!Number.isFinite(amount) || amount <= 0) return showToast('Số điểm không hợp lệ.', 'error');

    const pointsToApply = type === 'add' ? amount : -amount;
    const actorName = state.auth.fullName || state.auth.username || (state.auth.role === 'bcs' ? 'Ban Cán Sự' : 'GVCN');
    
    student.points = (student.points || 0) + pointsToApply; 
    student.stars = Math.max(0, (student.stars || 0) + pointsToApply);
    
    if (!student.history) student.history = [];
    student.history.push({
        id: Date.now(),
        date: new Date().toISOString(),
        points: pointsToApply,
        reason: `${String(reason).trim()} [${category}]`,
        performedBy: actorName,
        performedByRole: state.auth.role
    });
    
    saveData();
    renderLayout(); 
    showToast(`Đã ${type === 'add' ? 'cộng' : 'trừ'} ${points} điểm cho ${student.name}`, type === 'add' ? 'success' : 'error');
    if (type === 'add' && typeof triggerConfetti === 'function') triggerConfetti();
};

window.executePointsSubmission = function() {
    if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được dùng chức năng tích điểm tổng hợp.', 'error');
    const pf = state.pointsForm;
    const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
    
    if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
    if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
    
    let targetStudents = [];
    let successMsg = "";
    
    if (pf.targetType === 'student') {
        const selectedIds = Array.isArray(pf.selectedTargetIds) && pf.selectedTargetIds.length
            ? new Set(pf.selectedTargetIds.map(String))
            : new Set(pf.selectedTargetId ? [String(pf.selectedTargetId)] : []);
        targetStudents = state.students.filter(student => selectedIds.has(String(student.id)));
        if (!targetStudents.length) return showToast("Vui lòng chọn ít nhất một học sinh!", "error");
        const action = pf.actionType === 'add' ? 'cộng' : 'trừ';
        successMsg = targetStudents.length === 1
            ? `Đã ${action} ${Math.abs(pointsToApply)} điểm cho ${targetStudents[0].name}`
            : `Đã ${action} ${Math.abs(pointsToApply)} điểm cho ${targetStudents.length} học sinh`;
    } 
    else if (pf.targetType === 'group') {
        targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
        if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
        successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
    } 
    else if (pf.targetType === 'class') {
        targetStudents = [...state.students];
        if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
        successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
    }
    
    const currentReason = pf.reason.trim();
    const actorName = (state.auth && state.auth.role === 'bcs') ? 'Ban Cán Sự' : 'GVCN';
    
    const historyEntry = {
        id: Date.now(),
        date: new Date().toISOString(),
        points: pointsToApply,
        reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`,
        performedBy: actorName,
        performedByRole: state.auth.role
    };
    
    targetStudents.forEach(s => {
        s.points = (s.points || 0) + pointsToApply;
        s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
        if (!s.history) s.history = [];
        s.history.push({...historyEntry, id: Date.now() + Math.random()}); 
    });
    saveData();
    
    state.pointsForm.pointsVal = 0;
    state.pointsForm.reason = '';
    state.pointsForm.note = '';
    state.pointsForm.selectedTargetId = '';
    state.pointsForm.selectedTargetIds = [];
    
    renderLayout();
    showToast(successMsg, pointsToApply > 0 ? "success" : "error");
    if (pointsToApply > 0) triggerConfetti();
};

            const isThisWeek = (dateString) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                const now = new Date();
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(now.getFullYear(), now.getMonth(), diff);
                monday.setHours(0,0,0,0);
                return d >= monday;
            };

            // Hàm kiểm tra lịch sử có nằm trong tháng này không
            const isThisMonth = (dateString) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                const now = new Date();
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            };

            // Hàm tính điểm động theo bộ lọc
            const getStudentPoints = (student) => {
                if (timeframe === 'tong') return Number(student.points) || 0;
                let sum = 0;
                if (student.history) {
                    student.history.forEach(h => {
                        if (h.date) {
                            if (timeframe === 'tuan' && isThisWeek(h.date)) sum += Number(h.points);
                            if (timeframe === 'thang' && isThisMonth(h.date)) sum += Number(h.points);
                        }
                    });
                }
                return sum;

                });
                const allDates = matchingDates.sort((a,b) => {
                    const dateA = new Date(a.split('_')[0]);
                    const dateB = new Date(b.split('_')[0]);
                    if (dateA.getTime() === dateB.getTime()) {
