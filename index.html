                    }
                    return dateA - dateB;
                });
                
                const tableHeadDates = allDates.map(d => {
                    const parts = d.split('_');
                    const p = parts[0].split('-'); 
                    const session = parts[1] || '';
                    const sessionColor = session === 'Sáng' ? 'text-orange-400' : 'text-indigo-400';
                    const formatted = `${p[2]}/${p[1]}/${p[0]}<br><span class="text-[9px] font-black uppercase ${sessionColor}">${session}</span>`;
                    const dateLabel = `${p[2]}/${p[1]}/${p[0]}`;
                    const heading = canManageOthers
                        ? `<button type="button" title="Bấm để mở và sửa điểm danh ngày ${dateLabel}" onclick="openAttendanceDateForEdit('${parts[0]}','${escapeInlineJs(session)}')" class="text-white underline decoration-dotted underline-offset-2 hover:text-amber-200">${formatted}</button>`
                        : formatted;
                    return `<th class="p-4 text-center border-l border-white/10 whitespace-nowrap text-white font-bold text-xs tracking-wider w-20 leading-tight">${heading}</th>`;
                }).join('');
                
                const tableBodyRows = attendanceStudents.map((s, index) => {
                    let presentCount = 0, absentCount = 0;
                    const dateCells = allDates.map(d => {
                        const status = state.attendanceRecords[d][s.id]; 
                        let cellContent = '';
                        if (status === 'present') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center font-bold text-xs"><i class="ph-bold ph-check"></i></div>'; presentCount++; }
                        else if (status === 'late') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-yellow-50 text-yellow-500 flex items-center justify-center font-bold text-xs"><i class="ph-bold ph-clock"></i></div>'; presentCount++; }
                        else if (status === 'excused') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-blue-50 text-blue-500 flex items-center justify-center font-bold text-xs">P</div>'; absentCount++; }
                        else if (status === 'unexcused') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-red-50 text-red-500 flex items-center justify-center font-bold text-xs">KP</div>'; absentCount++; }
                        else { cellContent = '<div class="w-8 h-8 mx-auto text-slate-200 flex items-center justify-center">-</div>'; }
                        
                        return `<td class="p-2 text-center border-l border-slate-100">${cellContent}</td>`;
                    }).join('');
                    return `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors ${index % 2 !== 0 ? 'bg-slate-50/30' : 'bg-white'}">
                            <td class="p-4 text-center font-bold text-slate-400 text-xs">${index + 1}</td>
                            <td class="p-4 font-bold text-slate-800 whitespace-nowrap text-sm border-l border-slate-100">${getStudentDisplayName(s)}</td>
                            <td class="p-4 text-center border-l border-slate-100 font-bold text-sm bg-orange-50/30"><span class="text-emerald-600">${presentCount}</span><span class="text-slate-300 mx-1.5">/</span><span class="text-red-500">${absentCount}</span></td>
                            ${dateCells}
                        </tr>
                    `;
                }).join('');
                
                contentHtml = `
                    <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-4 bg-white p-5 rounded-[2rem] shadow-sm border border-slate-200 mb-6 relative z-10">
                        ${renderTabs()}
                        <div class="flex flex-wrap items-center gap-2">
                            <select onchange="window.attendanceStatsPeriod=this.value;renderLayout()" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-bold text-slate-700">
                                <option value="thang" ${filter === 'thang' ? 'selected' : ''}>Theo tháng</option>
                                <option value="tuan" ${filter === 'tuan' ? 'selected' : ''}>Theo tuần</option>
                            </select>
                            ${filter === 'thang'
                              ? `<input type="month" value="${escapeHtmlAttr(monthPrefix)}" onchange="window.attendanceStatsMonth=this.value;renderLayout()" aria-label="Chọn tháng thống kê điểm danh" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-slate-700">`
                              : `<input type="date" value="${escapeHtmlAttr(window.attendanceStatsDate || currentAttendanceDate)}" onchange="window.attendanceStatsDate=this.value;renderLayout()" aria-label="Chọn ngày trong tuần thống kê điểm danh" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-slate-700">`}
                            <div class="text-sm font-semibold text-slate-500 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200">Số buổi: <span class="font-black text-slate-800 text-lg ml-1">${allDates.length}</span></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative z-10 p-2">
                        <div class="overflow-x-auto overflow-y-auto flex-1 custom-scrollbar rounded-xl border border-slate-200">
                            <table class="w-full text-sm text-left border-collapse">
                                <thead class="text-[10px] text-white uppercase tracking-widest bg-[#1e1b4b] sticky top-0 z-10">
                                    <tr>
                                        <th class="p-4 text-center w-12">STT</th>
                                        <th class="p-4 border-l border-white/10 w-48">HỌ VÀ TÊN</th>
                                        <th class="p-4 text-center border-l border-white/10 leading-tight w-24">TỔNG<br><span class="text-[8px] font-normal opacity-70 lowercase">(Có mặt / Vắng)</span></th>
                                        ${tableHeadDates}
                                    </tr>
                                </thead>
                                <tbody>${tableBodyRows || '<tr><td colspan="100%" class="p-16 text-center text-slate-400 font-medium text-lg">Chưa có dữ liệu thống kê điểm danh nào.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
            // --- TAB XẾP HẠNG VI PHẠM (TOP VẮNG/TRỄ) ---
            else if (state.attendanceTab === 'top-vi-pham') {
                const filter = window.attendanceTopFilter;
                const now = new Date();
                
                // Hàm kiểm tra ngày có thuộc filter không
                const isDateInFilter = (dateStr) => {
                    if (filter === 'tong') return true;
                    const d = new Date(dateStr);
                    if (filter === 'tuan') {
                        const day = now.getDay();
                        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                        const monday = new Date(now.getFullYear(), now.getMonth(), diff);
                        monday.setHours(0,0,0,0);
                        return d >= monday;
                    }
                    if (filter === 'thang') {
                        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    }
                    if (filter === 'hk1') {
                        // Tính từ tháng 8 đến tháng 12
                        return (d.getMonth() + 1 >= 8 && d.getMonth() + 1 <= 12) && d.getFullYear() === (now.getMonth() < 7 ? now.getFullYear() - 1 : now.getFullYear());
                    }
                    if (filter === 'hk2') {
                        // Tính từ tháng 1 đến tháng 5
                        return (d.getMonth() + 1 >= 1 && d.getMonth() + 1 <= 5) && d.getFullYear() === (now.getMonth() > 5 ? now.getFullYear() + 1 : now.getFullYear());
                    }
                    return true;
                };

                // Thống kê đếm lỗi
                const studentStats = attendanceStudents.map(s => {
                    let late = 0, excused = 0, unexcused = 0, total = 0;
                    Object.keys(state.attendanceRecords).forEach(recordKey => {
                        const dateStr = recordKey.split('_')[0];
                        if (isDateInFilter(dateStr)) {
                            const status = state.attendanceRecords[recordKey][s.id];
                            if (status === 'late') { late++; total++; }
                            if (status === 'excused') { excused++; total++; }
                            if (status === 'unexcused') { unexcused++; total += 2; } // KP phạt nặng hơn trong việc xếp hạng để đẩy lên top
                        }
                    });
                    return { ...s, late, excused, unexcused, totalViPham: total };
                }).filter(s => s.totalViPham > 0).sort((a, b) => b.totalViPham - a.totalViPham);

                // Khung chọn thời gian
                const filterButtons = [
                    { id: 'tuan', label: 'Tuần này' },
                    { id: 'thang', label: 'Tháng này' },
                    { id: 'hk1', label: 'Học kì 1' },
                    { id: 'hk2', label: 'Học kì 2' },
                    { id: 'tong', label: 'Tổng cả năm' }
                ].map(f => `
                    <button onclick="window.attendanceTopFilter='${f.id}'; renderLayout();" class="px-4 py-2.5 rounded-lg text-xs font-bold transition-colors ${filter === f.id ? 'bg-red-50 text-red-600 border border-red-200 shadow-sm' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}">${f.label}</button>
                `).join('');

                const topListHtml = studentStats.length === 0 
                    ? '<div class="p-10 text-center text-emerald-500 font-bold bg-emerald-50 rounded-2xl border border-emerald-100 flex flex-col items-center gap-3"><i class="ph-fill ph-check-circle text-5xl"></i><span>Tuyệt vời! Không có học sinh nào vắng hay trễ trong khoảng thời gian này.</span></div>'
                    : studentStats.map((s, idx) => `
                        <div class="flex items-center gap-4 py-4 border-b border-slate-100 hover:bg-slate-50 transition-colors px-4 group">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center font-black ${idx < 3 ? 'bg-red-100 text-red-600 border border-red-200' : 'bg-slate-100 text-slate-400'}">${idx + 1}</div>
                            ${getAvatarImg(s.avatarUrl, getStudentDisplayName(s), 'w-12 h-12 ring-2 ring-white shadow-sm')}
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-slate-800 text-base truncate">${getStudentDisplayName(s)}</div>
                                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${s.group}</div>
                            </div>
                            <div class="flex gap-2 flex-wrap justify-end">
                                ${s.late > 0 ? `<div class="bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-lg border border-yellow-200 text-xs font-bold flex items-center gap-1"><i class="ph-bold ph-clock"></i> Trễ: ${s.late}</div>` : ''}
                                ${s.excused > 0 ? `<div class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-200 text-xs font-bold flex items-center gap-1">Vắng (P): ${s.excused}</div>` : ''}
                                ${s.unexcused > 0 ? `<div class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-red-200 text-xs font-bold flex items-center gap-1">Vắng (KP): ${s.unexcused}</div>` : ''}
                            </div>
                        </div>
                    `).join('');

                contentHtml = `
                    <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-4 bg-white p-5 rounded-[2rem] shadow-sm border border-slate-200 mb-6 relative z-10">
                        ${renderTabs()}
                        <div class="flex gap-2 flex-wrap">
                            ${filterButtons}
                        </div>
                    </div>
                   <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative z-10">
                        <div class="py-5 border-b border-slate-100 bg-red-50 px-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="text-sm font-black text-red-600 uppercase tracking-widest flex items-center gap-2"><i class="ph-fill ph-warning-circle text-xl"></i> BẢNG XẾP HẠNG HỌC SINH VẮNG/TRỄ</div>
                            <div class="flex items-center gap-3">
                                <div class="text-[11px] font-bold text-red-500 bg-white px-3 py-1.5 rounded-full border border-red-100 shadow-sm hidden md:block">Đã tính gộp Sáng & Chiều</div>
                                <button onclick="exportTopViPhamExcel()" class="px-4 py-2 bg-emerald-500 text-white font-bold rounded-xl shadow-md hover:bg-emerald-600 hover:-translate-y-0.5 transition-all flex items-center gap-2 text-xs">
                                    <i class="ph-bold ph-file-xls text-lg"></i> Xuất Excel để in
                                </button>
                            </div>
                        </div>
                        <div class="overflow-y-auto flex-1 custom-scrollbar p-4">
                            ${topListHtml}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-4 pb-12">
                    <div class="flex justify-between items-center py-2 pb-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-calendar-check text-emerald-500"></i> Quản lý Chuyên Cần</h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Theo dõi việc đi học hàng ngày của học sinh (Sáng/Chiều)</p>
                        </div>
                    </div>
                    ${contentHtml}
                </div>
            `;
        }
        
      // --- BẢNG QUY ĐỔI ĐIỂM CHUYÊN CẦN ---
        const ATTENDANCE_POINTS = {
            'present': { val: 1, reason: 'Có mặt' }, 
            'late': { val: -2, reason: 'Đi học muộn' },
            'excused': { val: -1, reason: 'Nghỉ có phép' },
            'unexcused': { val: -3, reason: 'Nghỉ không phép' }
        };
        window.applyAttendancePoints = function(studentId, status, dateStr) {
            const student = state.students.find(s => String(s.id) === String(studentId));
            if (!student) return;
            const config = ATTENDANCE_POINTS[status];
            if (!config || config.val === 0) return;
            student.points = Number(student.points || 0) + config.val;
            student.stars = Math.max(0, Number(student.stars || 0) + config.val);
            if (!student.history) student.history = [];
            student.history.push({
                id: `att_${dateStr}_${status}_${Date.now()}`,
                date: new Date().toISOString(),
                points: config.val,
                reason: config.reason + ` [Chuyên cần]`,
                isAttendance: true,
                attDate: dateStr,
                attStatus: status
            });
        };
        
        window.revertAttendancePoints = function(studentId, oldStatus, dateStr) {
            const student = state.students.find(s => String(s.id) === String(studentId));
            if (!student) return;
            const config = ATTENDANCE_POINTS[oldStatus];
            if (!config || config.val === 0) return;
            student.points = Number(student.points || 0) - config.val;
            student.stars = Math.max(0, Number(student.stars || 0) - config.val);
            if (student.history) {
                const idx = student.history.findIndex(h => h.isAttendance && h.attDate === dateStr && h.attStatus === oldStatus);
                if (idx > -1) {
                    student.history.splice(idx, 1);
                }
            }
        };
        
        window.markAttendance = async function(id, status) {
            if (!canManageAttendanceStudent(id)) {
                showToast('Bạn chỉ được điểm danh cho học sinh thuộc phạm vi được phân công.', 'error');
                return;
            }
            if (!['present', 'late', 'excused', 'unexcused'].includes(status) || (!isAttendanceLeader() && status !== 'present')) {
                showToast('Học sinh chỉ có thể tự xác nhận có mặt.', 'error');
                return;
            }
            const recordKey = currentAttendanceDate + '_' + window.currentAttendanceSession;
            if (!state.attendanceRecords[recordKey]) state.attendanceRecords[recordKey] = {};
            const oldStatus = state.attendanceRecords[recordKey][id];
            const nextStatus = oldStatus === status ? null : status;
            try {
                await window.saveAttendanceRecord(id, nextStatus, currentAttendanceDate, window.currentAttendanceSession);
            } catch (error) {
                console.error('Không thể lưu điểm danh:', error);
                showToast(error.message || 'Không thể lưu điểm danh. Hãy kiểm tra kết nối và quyền tài khoản.', 'error');
                return;
            }
            if (state.auth.role === 'gvcn' && oldStatus) window.revertAttendancePoints(id, oldStatus, recordKey);
            if (nextStatus) {
                state.attendanceRecords[recordKey][id] = nextStatus;
                if (state.auth.role === 'gvcn') window.applyAttendancePoints(id, nextStatus, recordKey);
            } else {
                delete state.attendanceRecords[recordKey][id];
                if (!Object.keys(state.attendanceRecords[recordKey]).length) delete state.attendanceRecords[recordKey];
            }
            const stu = state.students.find(s => String(s.id) === String(id));
            const statusText = nextStatus === 'present' ? 'Có mặt' : nextStatus === 'late' ? 'Đi muộn' : nextStatus === 'excused' ? 'Vắng (P)' : nextStatus === 'unexcused' ? 'Vắng (KP)' : 'Hủy điểm danh';
            if(stu && typeof logBCSAction === 'function') logBCSAction(`Điểm danh ${stu.name} (${window.currentAttendanceSession}): ${statusText}`);
            saveData(); 
            renderLayout();
        };
        
        window.markAllPresent = async function() {
            if (!isAttendanceLeader()) {
                showToast('Chỉ GVCN, lớp trưởng hoặc tổ trưởng mới được điểm danh nhiều học sinh.', 'error');
                return;
            }
            const recordKey = currentAttendanceDate + '_' + window.currentAttendanceSession;
            if (!state.attendanceRecords[recordKey]) state.attendanceRecords[recordKey] = {};
            const studentsToMark = getAttendanceScopeStudents().filter(student =>
                state.attendanceRecords[recordKey][student.id] !== 'present'
            );
            try {
                await window.saveAttendanceRecords(studentsToMark.map(student => ({
                    studentId: student.id,
                    status: 'present',
                    attendanceDate: currentAttendanceDate,
                    session: window.currentAttendanceSession,
                })));
            } catch (error) {
                console.error('Không thể điểm danh cả nhóm:', error);
                showToast(error.message || 'Không thể điểm danh. Hãy kiểm tra kết nối và quyền tài khoản.', 'error');
                return;
            }
            studentsToMark.forEach(s => {
                const oldStatus = state.attendanceRecords[recordKey][s.id];
                if (state.auth.role === 'gvcn' && oldStatus) window.revertAttendancePoints(s.id, oldStatus, recordKey);
                state.attendanceRecords[recordKey][s.id] = 'present';
                if (state.auth.role === 'gvcn') window.applyAttendancePoints(s.id, 'present', recordKey);
            });
            const groupLabel = state.auth.role === 'gvcn' ||
                String(getBcsLinkedStudent() && getBcsLinkedStudent().role || '').toLocaleLowerCase('vi').includes('lớp trưởng')
                ? 'cả lớp'
                : `cả ${getBcsLinkedStudent().group || 'tổ'}`;
            if(typeof logBCSAction === 'function') logBCSAction(`Đánh dấu ${groupLabel} có mặt: ${currentAttendanceDate} (${window.currentAttendanceSession})`);
            saveData(); 
            renderLayout(); 
            showToast(state.auth.role === 'gvcn'
                ? `Đã đánh dấu ${groupLabel} có mặt và tự động cộng điểm!`
                : `Đã cập nhật điểm danh cho ${groupLabel}.`, "success");
        };
        
        window.changeAttendanceDate = function(d) { 
            if(d) { currentAttendanceDate = d; renderLayout(); } 
        };

        window.openAttendanceDateForEdit = function(date, session) {
            if (!isAttendanceLeader()) {
                showToast('Chỉ GVCN, lớp trưởng hoặc tổ trưởng mới được sửa điểm danh.', 'error');
                return;
            }
            currentAttendanceDate = date;
            window.currentAttendanceSession = session || 'Sáng';
            state.attendanceTab = 'diem-danh';
            renderLayout();
        };

// --- XUẤT FILE EXCEL TOP VI PHẠM ---
        window.exportTopViPhamExcel = function() {
            const filter = window.attendanceTopFilter || 'thang';
            const now = new Date();
            
            const isDateInFilter = (dateStr) => {
                if (filter === 'tong') return true;
                const d = new Date(dateStr);
                if (filter === 'tuan') {
                    const day = now.getDay();
                    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                    const monday = new Date(now.getFullYear(), now.getMonth(), diff);
                    monday.setHours(0,0,0,0);
                    return d >= monday;
                }
                if (filter === 'thang') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                if (filter === 'hk1') return (d.getMonth() + 1 >= 8 && d.getMonth() + 1 <= 12) && d.getFullYear() === (now.getMonth() < 7 ? now.getFullYear() - 1 : now.getFullYear());
                if (filter === 'hk2') return (d.getMonth() + 1 >= 1 && d.getMonth() + 1 <= 5) && d.getFullYear() === (now.getMonth() > 5 ? now.getFullYear() + 1 : now.getFullYear());
                return true;
            };

            const studentStats = getAttendanceScopeStudents().map(s => {
                let late = 0, excused = 0, unexcused = 0, total = 0;
                Object.keys(state.attendanceRecords).forEach(recordKey => {
                    const dateStr = recordKey.split('_')[0];
                    if (isDateInFilter(dateStr)) {
                        const status = state.attendanceRecords[recordKey][s.id];
                        if (status === 'late') { late++; total++; }
                        if (status === 'excused') { excused++; total++; }
                        if (status === 'unexcused') { unexcused++; total += 2; }
                    }
                });
                return { ...s, late, excused, unexcused, totalViPham: total };
            }).filter(s => s.totalViPham > 0).sort((a, b) => b.totalViPham - a.totalViPham);

            if (studentStats.length === 0) {
                return showToast("Không có học sinh nào vi phạm để xuất file!", "error");
            }

            // Tạo dữ liệu cho file Excel
            const data = [
                ["BẢNG THỐNG KÊ HỌC SINH VẮNG/TRỄ (Đã gộp Sáng/Chiều)"], // Dòng tiêu đề
                [], // Dòng trống
                ["STT", "Họ và Tên", "Tổ", "Đi Trễ", "Vắng (Phép)", "Vắng (Không Phép)", "Điểm Phạt Tạm Tính"]
            ];
            
            studentStats.forEach((s, idx) => {
                // Điểm phạt mô phỏng: Trễ -2, Vắng(P) -1, Vắng(KP) -3
                const diemPhat = (s.late * -2) + (s.excused * -1) + (s.unexcused * -3);
                data.push([
                    idx + 1,
                    s.name,
                    s.group,
                    s.late,
                    s.excused,
                    s.unexcused,
                    diemPhat
                ]);
            });

            // Định dạng và xuất file
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch: 5}, {wch: 25}, {wch: 15}, {wch: 10}, {wch: 15}, {wch: 20}, {wch: 20}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DS_Vi_Pham");
            
            const filterNames = { 'tuan': 'TuanNay', 'thang': 'ThangNay', 'hk1': 'HocKi1', 'hk2': 'HocKi2', 'tong': 'TongCaNam' };

// --- NEW RANDOM PICKER ENGINE VARIABLES ---

        window.changePickerMode = function(mode) { pickerMode = mode; renderLayout(); }
        window.changePickerBg = function(bg) { pickerBg = bg; renderLayout(); }
        window.changePickTarget = function(target) { pickTarget = target; renderLayout(); }

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;
            stage.innerHTML = ''; // Clear old cards
            
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            if(listItems.length === 0) {
                stage.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-xl font-bold ${pickerBg === 'default' ? 'text-slate-400' : 'text-white/50'}">Chưa có dữ liệu.</div>`;
                return;
            }

            pickerItems = listItems.map((item, index) => {
                const el = document.createElement('div');
                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 transition-transform border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';
                el.style.height = '130px';
                
                // Color theme for avatar border
                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                let avatarHtml = '';
                if(pickTarget === 'student') {
                    avatarHtml = getAvatarImg(item.avatarUrl, item.name, "w-16 h-16 pointer-events-none ring-4 ring-white");
                } else {
                    avatarHtml = item.avatarUrl ? `<img src="${item.avatarUrl}" class="w-16 h-16 rounded-full object-cover ring-4 ring-white pointer-events-none">` : `<div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center ring-4 ring-white"><i class="ph-fill ph-users-three text-3xl text-slate-400"></i></div>`;
                }

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}
                    </div>
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                // Initial random positions
                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200, // for spiral/planet
                    baseX: 0, baseY: 0 // offset
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000; // time in seconds

            pickerItems.forEach((item, i) => {
                // Tốc độ thay đổi dựa trên việc có đang Pick (quay số) hay không
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    // Bouncing off walls
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    
                    // Add some random noise
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50; // Radius expands and contracts
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    // Center is sun, others orbit
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60; // wrap around
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                // Keep within bounds roughly
                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                // Apply transform relative to center
                item.el.style.transform = `translate(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px))`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;
            
            isPicking = true;
            document.getElementById('btn-start-pick').innerHTML = `<i class="ph-bold ph-spinner-gap text-2xl animate-spin"></i> ĐANG GỌI...`;
            document.getElementById('btn-start-pick').classList.replace('bg-emerald-600', 'bg-slate-400');
            
            // Start sounds
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); clickSynth.volume.value = -15; } catch(e) {}
            
            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

        function finishPick() {
            isPicking = false;
            cancelAnimationFrame(pickerAnimationId);
            
            const btn = document.getElementById('btn-start-pick');

            triggerConfetti();

            }

                    <div class="relative z-10 text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">${pickTarget === 'student' ? 'HỌC SINH ĐƯỢC CHỌN' : 'TỔ ĐƯỢC CHỌN'}</div>
                    <div class="relative z-10 text-3xl md:text-4xl font-black text-slate-800 text-center leading-tight mb-2">${winner.data.name}</div>
                    
                    ${winner.data.group ? `<div class="relative z-10 text-sm font-bold text-blue-600 uppercase bg-blue-50 px-4 py-1.5 rounded-xl border border-blue-100">${winner.data.group}</div>` : ''}

                </div>

            showRandomResultModal('', modalContent); // Dùng lại modal kết quả đã có
            
            // Resume background animation slowly
            pickerAnimationId = requestAnimationFrame(animatePicker);
        }

function renderViewBaoCao() {

    weekStartDate.setDate(weekStartDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    const weekStartStr = `${weekStartDate.getFullYear()}-${String(weekStartDate.getMonth() + 1).padStart(2, '0')}-${String(weekStartDate.getDate()).padStart(2, '0')}`;
    const monthStartStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;

        const week = { present: 0, late: 0, excused: 0, unexcused: 0 };
        const month = { present: 0, late: 0, excused: 0, unexcused: 0 };
        Object.entries(state.attendanceRecords || {}).forEach(([date, records]) => {
            const status = records && records[student.id];
            if (!['present', 'late', 'excused', 'unexcused'].includes(status)) return;
            if (date >= weekStartStr && date <= todayStr) week[status]++;
            if (date >= monthStartStr && date <= todayStr) month[status]++;
        });
        let pointsAddedThisMonth = 0;
        let pointsDeductedThisMonth = 0;
        (student.history || []).forEach(record => {
            const date = String(record.date || '').slice(0, 10);
            const points = Number(record.points) || 0;
            if (date >= monthStartStr && date <= todayStr) {
                if (points > 0) pointsAddedThisMonth += points;
                else pointsDeductedThisMonth += Math.abs(points);
            }
        });
        return { student, week, month, pointsAddedThisMonth, pointsDeductedThisMonth };
    });
    let present = 0, absent = 0, late = 0, excused = 0, unexcused = 0;
    
    const todayRecord = state.attendanceRecords[todayStr] || {};
    state.students.forEach(s => {
        const status = todayRecord[s.id];
        if (status === 'present') present++;
        else if (status === 'late') late++;
        else if (status === 'excused') { absent++; excused++; }
        else if (status === 'unexcused') { absent++; unexcused++; }
    });
    
    const tableRowsHtml = sortedStudents.map((s, index) => `

        const attendanceRowsHtml = attendanceStats.map((item, index) => `

            const monday = new Date(dObj.getFullYear(), dObj.getMonth(), diff);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            const f = (dt) => `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}`;
            return `${f(monday)} - ${f(sunday)}`;
        };
        const allWeeksSet = new Set();
        state.students.forEach(s => { if (s.history) s.history.forEach(h => { if (h.date) allWeeksSet.add(getWeekLabel(h.date)); }); });
        if (allWeeksSet.size === 0) allWeeksSet.add(getWeekLabel(new Date().toISOString()));
        const sortedWeeks = Array.from(allWeeksSet).sort((a,b) => a.split(' - ')[0].split('/').reverse().join('').localeCompare(b.split(' - ')[0].split('/').reverse().join('')));

        const weeklyDataRowsHtml = sortedStudents.map((s, index) => {

        window.exportData = function() {
            const dataStr = JSON.stringify(state, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `ChuyenTauThanhXuan_Backup_${getTodayString()}.json`;

            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("Đã tải xuống bản sao lưu!", "success");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (confirm("Cảnh báo: Dữ liệu hiện tại sẽ bị ghi đè hoàn toàn bởi dữ liệu từ file phục hồi. Bạn có chắc chắn muốn tiếp tục?")) {
                        state = { ...state, ...importedState };
                        applyStateDefaults();
                        saveData();
                        renderLayout();
                        showToast("Đã phục hồi dữ liệu thành công!", "success");
                    }
                } catch (error) {
                    showToast("File không hợp lệ hoặc bị lỗi!", "error");
                }
            };
            reader.readAsText(file);
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        };

        function saveSettings() { state.admin.className = document.getElementById('setting-classname').value; state.admin.name = document.getElementById('setting-gvcn').value; saveData(); renderLayout(); showToast("Đã lưu thông tin cài đặt", "success"); }

        window.handleRewardImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, (dataUrl) => {
                const imgInput = document.getElementById('edit-reward-image');
                if(imgInput) imgInput.value = dataUrl;
                
                const previewContainer = document.getElementById('reward-image-preview');
                if(previewContainer) {
                    previewContainer.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-contain p-2">`;
                }
            }, 800, 0.8);
        };

window.saveStudentEdit = function() {
    // 1. Lấy dữ liệu từ các ô nhập liệu
    const nameInput = document.getElementById('edit-s-name').value.trim();
    if (!nameInput) {
        return showToast("Vui lòng nhập họ và tên học sinh!", "error");
    }
    
    // 2. Thu thập toàn bộ thông tin trên form (Bao gồm 4 trường mới)
    const studentData = {
        name: nameInput,
        avatarUrl: document.getElementById('edit-s-avatar').value.trim(),
        gender: document.getElementById('edit-s-gender').value,
        group: document.getElementById('edit-s-group').value,
        dob: document.getElementById('edit-s-dob').value,
        address: document.getElementById('edit-s-address').value.trim(),
        phone: document.getElementById('edit-s-phone').value.trim(),
        citizenId: document.getElementById('edit-s-citizen-id').value.trim(),
        boardingType: document.getElementById('edit-s-boarding').value,
        code: document.getElementById('edit-s-code').value,
        role: document.getElementById('edit-s-role').value.trim() || 'Thành viên lớp',
        goal: document.getElementById('edit-s-goal').value.trim(),
        talent: document.getElementById('edit-s-talent').value.trim(),
        ethnicity: document.getElementById('edit-s-ethnicity').value.trim() || 'Kinh',
        isUnionMember: document.getElementById('edit-s-union').value,
        prevAcademic: document.getElementById('edit-s-prev-academic').value,
        prevConduct: document.getElementById('edit-s-prev-conduct').value,
        prevTitle: document.getElementById('edit-s-prev-title').value.trim()
    };
    
    // 3. Xử lý lưu hồ sơ học sinh
    const existingIndex = state.editingStudentId
        ? state.students.findIndex(s => s.id === state.editingStudentId)
        : -1;
    if (state.editingStudentId && existingIndex < 0) {
        return showToast("Không tìm thấy hồ sơ học sinh cần cập nhật.", "error");
    }
    const newId = state.students.length > 0 ? Math.max(...state.students.map(s => Number(s.id) || 0)) + 1 : 1;
    const candidate = existingIndex >= 0
        ? { ...state.students[existingIndex], ...studentData }
        : { ...studentData, id: newId, points: 0, stars: 0, history: [], comment: '' };
    if (existingIndex >= 0) {
        state.students[existingIndex] = candidate;
        if(typeof logBCSAction === 'function') logBCSAction('Sửa thông tin học sinh: ' + studentData.name);
        showToast("Đã cập nhật hồ sơ học sinh thành công!", "success");
    } else {
        state.students.push(candidate);
        if(typeof logBCSAction === 'function') logBCSAction('Thêm học sinh mới: ' + studentData.name);
        showToast("Đã thêm học sinh mới thành công!", "success");
    }
    
    // 4. Lưu dữ liệu, cập nhật giao diện và đóng form
    saveData();
    renderLayout();
    closeModal('edit-student-modal');
};
window.deleteStudent = function(id) {
    if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được xóa học sinh.', 'error');
    const studentIndex = state.students.findIndex(s => s.id === id);
    if (studentIndex === -1) return;
    
    const studentName = state.students[studentIndex].name;
    if (confirm(`Bạn có chắc chắn muốn xóa học sinh "${studentName}" khỏi danh sách không? Hành động này sẽ xóa luôn cả lịch sử thi đua của em ấy và không thể hoàn tác!`)) {
        
        state.students.splice(studentIndex, 1);
        
        if (state.attendanceRecords) {
            for (const date in state.attendanceRecords) {
                if (state.attendanceRecords[date][id]) {
                    delete state.attendanceRecords[date][id];
                }
            }
        }
        
        saveData();
        renderLayout();
        showToast(`Đã xóa triệt để ${studentName} khỏi hệ thống!`, "success");
    }
};

        function handleExcelUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const workbook = XLSX.read(evt.target.result, {type: 'binary'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                    processImportRows(rows);
                } catch(err) { showToast("Lỗi định dạng file Excel.", "error"); }
            };
            reader.readAsBinaryString(file);
        }

        function processPastedData() {
            const text = document.getElementById('import-paste-area').value.trim();
            if (!text) return showToast("Vui lòng dán dữ liệu!", "error");
            processImportRows(text.split('\n').map(row => row.split('\t')));
        }

      function processImportRows(rows) {
            const importedStudents = [];
            let currentId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
            const header = (rows[0] || []).map(value => String(value || '').trim().toLocaleLowerCase('vi'));
            const hasHeader = header.some(value => value.includes('họ tên') || value.includes('ho ten') || value.includes('họ và tên'));
            const legacyFormat = hasHeader && header.some(value => value.includes('lưu trú') || value.includes('luu tru'));
            const normalizeHeader = value => String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/đ/g, 'd')
                .replace(/[^a-z0-9]/g, '');
            const columnAliases = {
                name: ['hoten', 'hovaten', 'hotenbatbuoc'],
                gender: ['gioitinh'],
                group: ['tothidua'],
                role: ['vaitro'],
                goal: ['muctieuphandau'],
                talent: ['nangkhieu'],
                dob: ['ngaysinh'],
                address: ['diachi'],
                phone: ['sdtlienhe', 'sodienthoai', 'dienthoai'],
                citizenId: ['socccd', 'cccd'],
                ethnicity: ['dantoc'],
                isUnionMember: ['doanvienroichua', 'doanvien'],
                prevAcademic: ['hoclucnamtruoc'],
                prevConduct: ['renluyennamtruoc'],
                prevTitle: ['danhhieunamtruocneuco', 'danhhieunamtruoc']
            };
            const columnIndexes = Object.fromEntries(Object.entries(columnAliases).map(([field, aliases]) => [
                field,
                header.findIndex(value => aliases.includes(normalizeHeader(value)))
            ]));
            const readCell = (row, field, fallbackIndex) => {
                const index = hasHeader && !legacyFormat && columnIndexes[field] >= 0
                    ? columnIndexes[field]
                    : fallbackIndex;
                return (row[index] || '').toString().trim();
            };
            rows.forEach((row, i) => {
                if (i === 0 && hasHeader) return;
                const name = readCell(row, 'name', 0); if (!name) return;
                importedStudents.push({
                    id: currentId++, name,
                    gender: readCell(row, 'gender', 1) || 'Nam',
                    group: readCell(row, 'group', 2) || 'Tổ 1',
                    role: readCell(row, 'role', 3),
                    goal: readCell(row, 'goal', 4),
                    talent: readCell(row, 'talent', 5),
                    dob: readCell(row, 'dob', 6),
                    address: legacyFormat ? '' : readCell(row, 'address', 7),
                    phone: legacyFormat ? '' : readCell(row, 'phone', 8),
                    citizenId: legacyFormat ? '' : readCell(row, 'citizenId', 9),
                    boardingType: legacyFormat ? (row[7] || '').toString().trim() || 'Ngoại trú' : 'Ngoại trú',
                    ethnicity: (legacyFormat ? row[8] : readCell(row, 'ethnicity', 10) || '').toString().trim() || 'Kinh',
                    isUnionMember: (legacyFormat ? row[9] : readCell(row, 'isUnionMember', 11) || '').toString().trim() || 'Chưa',
                    prevAcademic: (legacyFormat ? row[10] : readCell(row, 'prevAcademic', 12) || '').toString().trim(),
                    prevConduct: (legacyFormat ? row[11] : readCell(row, 'prevConduct', 13) || '').toString().trim(),
                    prevTitle: legacyFormat ? '' : readCell(row, 'prevTitle', 14),
                    avatarUrl: '', points: 0, stars: 0, code: generateUniqueCode(), history: [] 
                });
            });
            const addedCount = importedStudents.length;
            if (addedCount > 0) {
                state.students.push(...importedStudents);
            }
            if (addedCount > 0) { saveData(); renderLayout(); closeModal('import-modal'); showToast(`Đã nhập thành công ${addedCount} học sinh!`, "success"); }
        }

                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById('modal-confetti-canvas'); if (!canvas) return;
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+3, dx: Math.random()*16-8, dy: Math.random()*-15-8, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
                function render() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                    particles.forEach(p => {
                        if (p.y < canvas.height) active++;
                        p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.25;
                        ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke();
                    });
                    if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
                } render();
            }, 100);
        }

        function showParentView(studentId) {
            const student = state.students.find(s => s.id === studentId); if (!student) return;
            if (state.auth && state.auth.role === 'bcs' && !canBcsManageStudent(student)) {
                showToast('Bạn không có quyền xem hồ sơ học sinh này.', 'error');

                    showToast('Bạn chỉ được xem hồ sơ của chính mình.', 'error');
                    return;
                }
            }
            const maxPoints = 500; const milestones = [100, 300, 500];
            const currentPoints = student.points || 0;
            let nextMilestone = milestones.find(m => m > currentPoints) || maxPoints;
            let progressPercent = Math.min(100, (currentPoints / maxPoints) * 100);

            let present = 0, late = 0, excused = 0, unexcused = 0;
            if (state.attendanceRecords) {

                    if (dayRecord[student.id] === 'present') present++;
                    if (dayRecord[student.id] === 'late') late++;

        window.handleTopBannerUpload = function(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            if (!file) return;
            if ((file.type && !file.type.startsWith('image/')) || file.size > 10 * 1024 * 1024) {
                input.value = '';
                showToast(file.size > 10 * 1024 * 1024 ? 'Ảnh banner cần nhỏ hơn 10 MB.' : 'Vui lòng chọn tệp ảnh hợp lệ.', 'error');

            const previousBanner = state.theme.topBannerUrl;
            compressImage(file, (dataUrl) => {
                try {
                    state.theme.topBannerUrl = dataUrl;
                    saveData();
                    renderLayout();
                    showToast('Đã cập nhật banner đầu trang.', 'success');

                    state.theme.topBannerUrl = previousBanner;
                    throw error;

                showToast(error.message || 'Không thể tải ảnh banner.', 'error');

window.exportToPDF = function() {
            const element = document.getElementById('report-container');
            if (!element) return showToast("Không tìm thấy nội dung báo cáo!", "error");
            
            // Đổi trạng thái nút bấm để báo hiệu đang xử lý
            const btn = document.getElementById('btn-export-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph-bold ph-spinner-gap animate-spin text-lg"></i> Đang tạo PDF...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // Cấu hình file PDF xuất ra (Nằm ngang, khổ A4, chất lượng nét)
            const opt = {
                margin:       10,
                filename:     `BaoCao_${state.admin.className || 'Lop'}_${getTodayString()}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Thực hiện xuất file
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Đã tải xuống file PDF thành công!", "success");
            }).catch(err => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                showToast("Lỗi khi tạo PDF, vui lòng thử lại!", "error");
                console.error(err);
            });
        };

// Hàm xử lý khi gõ số vào ô Phút/Giây
window.handleTimerInput = function() {
    if(isTimerRunning) return; // Không cho sửa khi đang chạy
    let inpM = parseInt(document.getElementById('timer-inp-m').value) || 0;
    let inpS = parseInt(document.getElementById('timer-inp-s').value) || 0;
    
    // Quy đổi nếu giây > 60
    if (inpS >= 60) {
        inpM += Math.floor(inpS / 60);
        inpS = inpS % 60;
        document.getElementById('timer-inp-m').value = inpM;
        document.getElementById('timer-inp-s').value = inpS;
    }
    
    timerSeconds = (inpM * 60) + inpS;
    document.getElementById('timer-main-display').innerText = `${String(inpM).padStart(2, '0')}:${String(inpS).padStart(2, '0')}`;
};

// Cập nhật giao diện đồng hồ khi đang chạy
window.updateTimerView = function() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    
    const display = document.getElementById('timer-main-display');
    const inpM = document.getElementById('timer-inp-m');
    const inpS = document.getElementById('timer-inp-s');
    
    if(display) display.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    
    // Nếu đang chạy thì cập nhật luôn cả số ở ô nhập
    if (isTimerRunning) {
        if(inpM) inpM.value = m;
        if(inpS) inpS.value = s;
    }
};

    const btn = document.getElementById('btn-timer-start');
    if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if(btn) btn.innerText = 'Bắt Đầu';
    } else {
        if (timerSeconds <= 0) return showToast("Vui lòng nhập thời gian!", "error");
        
        // Khởi động âm thanh nếu chưa bật
        if (typeof Tone !== 'undefined') {
            if (Tone.context.state !== 'running') Tone.start();
            // Cài đặt âm thanh "tíc tắc" nếu chưa có
            if (!tickSynth) {
                tickSynth = new Tone.Synth({
                    oscillator: { type: "triangle" }, // Dùng sóng tam giác nghe cho êm, không bị chói
                    envelope: { attack: 0.01, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                tickSynth.volume.value = -12; // Âm lượng nhỏ gọn, vừa phải
            }
        }
        
        isTimerRunning = true;
        if(btn) btn.innerText = 'Tạm Dừng';
        
        timerInterval = setInterval(() => {
            timerSeconds--;
            if(timerSeconds < 0) timerSeconds = 0;
            updateTimerView();
            
            // Phát âm "tíc tắc" mỗi giây
            if (timerSeconds > 0 && tickSynth) {
                // Nhịp chẵn kêu tíc (nốt cao), nhịp lẻ kêu tắc (nốt trầm)
                const pitch = (timerSeconds % 2 === 0) ? "E5" : "C5";
                tickSynth.triggerAttackRelease(pitch, "32n");
            }
            
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                if(btn) btn.innerText = 'Bắt Đầu';
                showToast("Đã hết thời gian!", "success");
                
                if (typeof triggerConfetti === 'function') triggerConfetti();
                playBellSound(currentBellIndex); // Phát âm thanh chuông lúc hết giờ
            }
        }, 1000);
    }
};
window.endTimer = function() {
    clearInterval(timerInterval);
    isTimerRunning = false;
    timerSeconds = 0;
    updateTimerView();
    
    const inpM = document.getElementById('timer-inp-m');
    const inpS = document.getElementById('timer-inp-s');
    if(inpM) inpM.value = '0';
    if(inpS) inpS.value = '0';
    
    const btn = document.getElementById('btn-timer-start');
    if(btn) btn.innerText = 'Bắt Đầu';
};

// Xử lý chọn màu chuông
window.selectBell = function(idx) {
    currentBellIndex = idx;
    document.querySelectorAll('.bell-btn').forEach((el, i) => {
        if(i === idx) el.classList.add('ring-2', 'ring-offset-2', 'ring-slate-400', 'scale-110');
        else el.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-400', 'scale-110');
    });
    // Phát thử âm thanh
    if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.start();
    playBellSound(idx);
};

// Hàm phát âm thanh với các nốt nhạc khác nhau tùy theo chuông
window.playBellSound = function(idx = 0) {
    try {
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -5;
        // Các dải âm thanh khác nhau cho 6 loại chuông
        const notesList = [
            ['C5', 'E5', 'G5', 'C6'], // Vàng (Mặc định)
            ['D5', 'F#5', 'A5', 'D6'], // Xanh dương
            ['E5', 'G#5', 'B5', 'E6'], // Đỏ
            ['F5', 'A5', 'C6', 'F6'], // Xanh lá
            ['G5', 'B5', 'D6', 'G6'], // Tím
            ['A5', 'C#6', 'E6', 'A6']  // Cam
        ];
        const notes = notesList[idx % notesList.length];
        synth.triggerAttackRelease(notes, "1n");
    } catch(e) {}
};

        function escapeTimetableText(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function getTimetableWeekStart(value) {
            const date = value instanceof Date ? new Date(value) : new Date(`${value || ''}T00:00:00`);
            if (Number.isNaN(date.getTime())) return getTimetableWeekStart(new Date());
            const daysSinceMonday = (date.getDay() + 6) % 7;
            date.setDate(date.getDate() - daysSinceMonday);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getTimetableDateForDay(weekStart, day) {
            const date = new Date(`${weekStart}T00:00:00`);
            date.setDate(date.getDate() + Number(day) - 1);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function getTimetableReminderDate(weekStart, reminder) {
            const date = String(reminder && reminder.date || '');
            return /^\d{4}-\d{2}-\d{2}$/.test(date)
                ? date
                : getTimetableDateForDay(weekStart, Number(reminder && reminder.day) || 1);
        }

        function getTimetableReminderEntries() {
            return Object.entries(state.timetableReminders || {}).flatMap(([weekStart, entries]) =>
                (Array.isArray(entries) ? entries : []).map(entry => ({
                    ...entry,
                    date: getTimetableReminderDate(weekStart, entry),
                }))
            ).filter(isTimetableReminderForCurrentUser);
        }

        function isTimetableReminderForCurrentUser(reminder) {
            if (state.auth && state.auth.role === 'gvcn') return true;
            if (!Array.isArray(reminder.recipientIds) || !reminder.recipientIds.length) return true;
            const studentId = String(state.auth && state.auth.studentId || '');
            return Boolean(studentId) && reminder.recipientIds.map(String).includes(studentId);
        }

        function formatTimetableDate(value) {
            const date = new Date(`${value}T00:00:00`);
            return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString('vi-VN');
        }

        function migrateLegacyTimetableReminders() {
            if (!state.timetableReminders || typeof state.timetableReminders !== 'object' || Array.isArray(state.timetableReminders)) {
                state.timetableReminders = {};
            }
            for (const [week, reminders] of Object.entries(state.timetableReminders)) {
                if (!Array.isArray(reminders)) continue;
                reminders.forEach(reminder => {
                    if (!reminder.date) reminder.date = getTimetableDateForDay(week, Number(reminder.day) || 1);
                });
            }
            if (!state.dailySchedule) return;
            const weekStart = getTimetableWeekStart(state.timetable && state.timetable.effectiveDate || new Date());
            const weekReminders = state.timetableReminders[weekStart] || (state.timetableReminders[weekStart] = []);
            for (const [dayKey, entries] of Object.entries(state.dailySchedule)) {
                if (!Array.isArray(entries)) continue;
                entries.forEach((entry, index) => {
                    const message = String(entry.reminder || '').trim();
                    if (!message) return;
                    const legacyId = `legacy-${dayKey}-${index}-${entry.session || ''}`;
                    if (weekReminders.some(reminder => reminder.id === legacyId)) return;
                    weekReminders.push({
                        id: legacyId,
                        day: Number(dayKey),
                        date: getTimetableDateForDay(weekStart, Number(dayKey)),
                        session: entry.session || '',
                        period: entry.period || `Tiết ${index + 1}`,
                        time: entry.time || '',
                        subject: entry.subject || '',
                        message,
                        createdAt: new Date().toISOString()
                    });
                });
            }
        }

        function recordTimetableHistory(reason) {
            if (!Array.isArray(state.timetableHistory)) state.timetableHistory = [];
            if (!state.timetable) state.timetable = {};
            state.timetableHistory.push({
                id: `tkb-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
                changedAt: new Date().toISOString(),
                reason,
                effectiveDate: state.timetable.effectiveDate || '',
                schedule: JSON.parse(JSON.stringify(state.dailySchedule || {}))
            });
            state.selectedTimetableHistoryId = '';
            saveData();
        }

        function getTimetableRows(session, schedule = state.dailySchedule) {
            const defaultRows = session === 'Sáng'
                ? [
                    { period: 'Tiết 1', time: '07:00 - 07:45' },
                    { period: 'Tiết 2', time: '08:00 - 08:45' },
                    { period: 'Tiết 3', time: '08:50 - 09:35' },
                    { period: 'Tiết 4', time: '09:40 - 10:25' },
                    { period: 'Tiết 5', time: '10:30 - 11:15' }
                ]
                : [
                    { period: 'Tiết 1', time: '14:00 - 14:45' },
                    { period: 'Tiết 2', time: '14:50 - 15:35' },
                    { period: 'Tiết 3', time: '15:40 - 16:25' },
                    { period: 'Tiết 4', time: '16:30 - 17:15' }
                ];
            const dayRows = Array.from({ length: 6 }, (_, index) => {
                const entries = (schedule && schedule[index + 1] || []).filter(entry => {
                    const hour = Number(String(entry.time || '').match(/(\d{1,2})(?::|h)/i)?.[1]);
                    const entrySession = entry.session || (hour >= 12 ? 'Chiều' : 'Sáng');
                    return entrySession === session;
                });
                return entries.length ? entries : defaultRows.map(row => ({ ...row, session, subject: '', teacher: '', reminder: '' }));
            });
            const rowCount = Math.max(defaultRows.length, ...dayRows.map(rows => rows.length));
            return dayRows.map(rows => Array.from({ length: rowCount }, (_, index) => rows[index] || {
                period: defaultRows[index]?.period || `Tiết ${index + 1}`,
                time: defaultRows[index]?.time || '--:--',
                session,
                subject: '',
                reminder: '',
                teacher: ''
            }));
        }

        function renderTimetableSession(session, accentClass, schedule = state.dailySchedule, canEdit = !!(state.auth && state.auth.role === 'gvcn'), reminderWeek = '') {
            const days = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
            const dayRows = getTimetableRows(session, schedule);
            const rowCount = dayRows[0].length;
            const rowTemplate = dayRows[0];
            const body = Array.from({ length: rowCount }, (_, rowIndex) => `
                <tr class="${rowIndex % 2 ? 'bg-white' : 'bg-sky-50/60'}">
                    <td class="border border-sky-200 p-1"><input aria-label="Tên tiết ${rowIndex + 1} buổi ${session}" value="${escapeTimetableText(rowTemplate[rowIndex].period || `Tiết ${rowIndex + 1}`)}" onchange="updateTimetableSlotMeta('${session}', ${rowIndex}, 'period', this.value)" ${canEdit ? '' : 'disabled'} class="w-full min-w-16 bg-transparent text-center font-black text-indigo-900 outline-none focus:bg-amber-50 rounded-md px-1 py-2"></td>
                    <td class="border border-sky-200 p-1"><input aria-label="Giờ tiết ${rowIndex + 1} buổi ${session}" value="${escapeTimetableText(rowTemplate[rowIndex].time || '--:--')}" onchange="updateTimetableSlotMeta('${session}', ${rowIndex}, 'time', this.value)" ${canEdit ? '' : 'disabled'} class="w-full min-w-24 bg-transparent text-center font-bold text-indigo-900 outline-none focus:bg-amber-50 rounded-md px-1 py-2"></td>
                    ${days.map((_, dayIndex) => {
                        const entry = dayRows[dayIndex][rowIndex] || {};
                        const reminderDate = getTimetableDateForDay(reminderWeek, dayIndex + 1);
                        const slotReminders = ((state.timetableReminders || {})[reminderWeek] || []).filter(reminder =>
                            Number(reminder.day) === dayIndex + 1 &&
                            reminder.session === session &&

                            isTimetableReminderForCurrentUser(reminder)
                        );

                            <button type="button" onclick="openTimetableReminderModal(${dayIndex + 1}, '${session}', ${rowIndex}, '${reminderWeek}', '${escapeInlineJs(entry.subject || '')}', '${escapeInlineJs(entry.period || rowTemplate[rowIndex].period || '')}', '${escapeInlineJs(entry.time || rowTemplate[rowIndex].time || '')}')" class="w-full min-w-24 rounded-lg px-2 py-2 text-center font-semibold ${slotReminders.length ? 'bg-amber-50 text-amber-900 hover:bg-amber-100' : 'bg-transparent text-slate-800 hover:bg-sky-100'}">

                <section class="rounded-2xl overflow-hidden border border-sky-300 bg-white shadow-sm">

                            <tbody>${body}</tbody>
                        </table>
                    </div>
                    ${canEdit ? `<button onclick="addTimetableSlot('${session}')" class="m-3 px-4 py-2 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-xs hover:bg-indigo-100">+ Thêm tiết ${session.toLowerCase()}</button>` : ''}

            `;
        }

        function renderTimetablePrintSession(session, schedule = state.dailySchedule) {
            const days = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
            const dayColors = ['#dbeafe', '#fef3c7', '#ede9fe', '#dcfce7', '#e0f2fe', '#f3e8ff'];
            const rows = getTimetableRows(session, schedule);
            const rowCount = rows[0].length;
            const body = Array.from({ length: rowCount }, (_, rowIndex) => {
                const cells = rows.map(day => day[rowIndex] || {});
                const period = cells[0].period || `Tiết ${rowIndex + 1}`;
                const time = cells[0].time || '--:--';
                return `<tr>
                    <td style="border:1px solid #8ba8c8;background:#eff6ff;text-align:center;font-weight:800;padding:5px 4px;">${escapeTimetableText(period.replace(/^Tiết\\s*/i, ''))}</td>
                    <td style="border:1px solid #8ba8c8;background:#eff6ff;text-align:center;font-weight:800;white-space:nowrap;padding:5px 6px;">${escapeTimetableText(time)}</td>
                    ${cells.map(cell => `<td style="border:1px solid #8ba8c8;text-align:center;padding:5px 4px;height:25px;">${escapeTimetableText(cell.subject || '')}</td>`).join('')}
                </tr>`;
            }).join('');
            return `<section style="margin-top:12px;">
                <div style="display:flex;align-items:center;gap:12px;margin:0 0 5px;color:#1e3a8a;">

                        <th style="border:1px solid #8ba8c8;background:#bfdbfe;padding:6px 3px;">Tiết</th>
                        <th style="border:1px solid #8ba8c8;background:#bfdbfe;padding:6px 3px;">Giờ</th>

                </table>

        window.downloadTimetablePdf = async function() {
            if (typeof html2pdf !== 'function') {
                showToast('Không tải được công cụ xuất PDF. Hãy kiểm tra kết nối rồi thử lại.', 'error');

            const selectedHistory = (state.timetableHistory || []).find(entry => entry.id === state.selectedTimetableHistoryId);
            const effectiveDate = selectedHistory && selectedHistory.effectiveDate
                ? selectedHistory.effectiveDate
                : state.timetable && state.timetable.effectiveDate
                ? state.timetable.effectiveDate
                : `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const displayedSchedule = selectedHistory ? selectedHistory.schedule : state.dailySchedule;
            const formattedEffectiveDate = new Date(`${effectiveDate}T00:00:00`).toLocaleDateString('vi-VN');
            const academicYear = state.academicYear || `${today.getFullYear()} - ${today.getFullYear() + 1}`;

            printRoot.innerHTML = `
                <div style="border:3px solid #93c5fd;border-radius:22px;padding:20px 24px;background:linear-gradient(145deg,#f0f9ff 0%,#ffffff 48%,#eff6ff 100%);">
                    <header style="display:grid;grid-template-columns:1fr 2fr 150px;align-items:center;gap:18px;min-height:120px;">
                        <div style="border:2px solid #93c5fd;border-radius:14px;padding:12px;background:#fff;font-size:13px;line-height:1.65;font-weight:700;">
                            <div>Trường <strong>THPT QUANG TRUNG</strong></div>
                            <div>Học kỳ ${escapeTimetableText(state.currentSemester || 'I')}</div>

                            <div style="display:inline-block;margin-top:8px;padding:7px 34px;border-radius:28px;background:#fda4af;color:#fff;font-weight:900;font-size:21px;">LỚP ${className}</div>
                            <div style="margin-top:7px;display:inline-block;padding:5px 28px;border-radius:24px;background:#bae6fd;color:#172554;font-weight:900;font-size:15px;">NĂM HỌC ${escapeTimetableText(academicYear)}</div>
                        </div>
                        <div style="display:flex;justify-content:center;align-items:center;">
                            <img src="${escapeTimetableText(schoolLogo)}" alt="Logo trường THPT Quang Trung" style="width:135px;height:120px;object-fit:contain;">
                        </div>
                    </header>
                    ${renderTimetablePrintSession('Sáng', displayedSchedule)}
                    ${renderTimetablePrintSession('Chiều', displayedSchedule)}
                    <footer style="margin-top:16px;padding:10px;text-align:center;border-radius:40px;background:#dbeafe;color:#1e3a8a;font-size:20px;font-weight:900;font-style:italic;">Đoàn kết - Nỗ lực - Thành công</footer>
                </div>`;
            document.body.appendChild(printRoot);
            try {
                const safeClassName = String(state.admin && state.admin.className || 'Lop').replace(/[^a-z0-9_-]+/gi, '_');
                await html2pdf().set({
                    margin: [6, 6, 6, 6],
                    filename: `Thoi_Khoa_Bieu_${safeClassName}_${effectiveDate}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: 1100 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                    pagebreak: { mode: ['avoid-all', 'css'] }
                }).from(printRoot).save();
                showToast('Đã tải thời khóa biểu PDF theo mẫu, kèm logo trường.', 'success');
            } catch (error) {
                console.error('Không thể xuất thời khóa biểu PDF:', error);
                showToast('Xuất thời khóa biểu thất bại. Vui lòng thử lại.', 'error');
            } finally {
                printRoot.remove();
            }
        };

            const selectedHistory = state.timetableHistory.find(entry => entry.id === state.selectedTimetableHistoryId);

            const weeklyRemindersHtml = weeklyReminders.length

                    const day = Number(entry.day);
                    const createdAt = new Date(entry.createdAt || '');

                    return `
                    <article class="flex items-start justify-between gap-3 rounded-xl border border-amber-200 bg-amber-50 p-3 shadow-sm">
                        <div class="min-w-0 flex-1">

                            ${canEdit ? `<div class="mt-2 flex flex-wrap justify-end gap-1"><button type="button" onclick="editTimetableReminder('${escapeInlineJs(reminderWeek)}','${escapeInlineJs(entry.id)}')" class="rounded-md bg-white px-2 py-1 text-[10px] font-black text-amber-800 shadow-sm hover:bg-amber-100">Sửa</button><button type="button" onclick="deleteTimetableReminder('${escapeInlineJs(reminderWeek)}','${escapeInlineJs(entry.id)}')" class="rounded-md bg-white px-2 py-1 text-[10px] font-black text-rose-700 shadow-sm hover:bg-rose-50">Xóa</button></div>` : ''}
                        </div>
                    </article>
                `}).join('')
                : `<div class="rounded-xl border border-dashed border-slate-300 bg-white/70 p-5 text-center text-xs font-semibold text-slate-500">${canEdit ? 'Bấm “Thêm lời nhắc” ở ô môn học để mở khung nhập lớn. Nhấn Enter để lưu, Shift+Enter để xuống dòng.' : 'Tuần này chưa có lời nhắc nào.'}</div>`;
            const historyOptions = [...state.timetableHistory].reverse().map(entry => {
                const changedAt = new Date(entry.changedAt).toLocaleString('vi-VN');
                const effectiveDate = entry.effectiveDate
                    ? new Date(`${entry.effectiveDate}T00:00:00`).toLocaleDateString('vi-VN')
                    : 'chưa đặt';
                return `<option value="${escapeTimetableText(entry.id)}" ${selectedHistory && selectedHistory.id === entry.id ? 'selected' : ''}>${escapeTimetableText(changedAt)} — Áp dụng từ ${escapeTimetableText(effectiveDate)}</option>`;
            }).join('');
            return `
                <div class="max-w-7xl mx-auto animate-fade-in pb-12 pt-2">

                        <div class="absolute -top-8 -right-5 text-7xl text-amber-300/70 pointer-events-none"><i class="ph-fill ph-sun"></i></div>
                        <div class="absolute bottom-2 left-4 text-5xl text-emerald-500/40 pointer-events-none"><i class="ph-fill ph-books"></i></div>
                        <div class="relative z-10 text-center">
                            <div class="flex flex-wrap justify-between items-start gap-3 text-left mb-5">
                                <div class="rounded-2xl border-2 border-sky-300 bg-white/85 px-4 py-3 text-xs font-bold text-indigo-950">
                                    <div>Trường: <span class="font-black">THPT QUANG TRUNG</span></div>
                                    <label class="mt-2 flex items-center gap-2">Áp dụng từ:
                                        <input type="date" value="${escapeTimetableText(displayedEffectiveDate)}" ${canEdit ? `onchange="updateTimetableEffectiveDate(this.value)"` : 'disabled'} class="rounded-lg border border-sky-200 bg-white px-2 py-1 text-indigo-900">

                                <div class="flex flex-wrap items-center justify-end gap-2">
                                    <img src="${escapeTimetableText(state.theme && state.theme.schoolLogo ? state.theme.schoolLogo : './logo.png')}" alt="Logo trường THPT Quang Trung" class="h-20 w-24 rounded-xl bg-white object-contain p-1 shadow-sm border border-sky-100">

                            <div class="mt-2 font-black text-indigo-900">NĂM HỌC ${today.getFullYear()} - ${today.getFullYear() + 1}</div>

                                    ${historyOptions}
                                </select>

                                    ${renderTimetableSession('Chiều', 'bg-indigo-100', displayedSchedule, canEdit, reminderWeek)}
                                </div>
                                <aside class="rounded-2xl border border-amber-200 bg-gradient-to-b from-amber-50 to-white p-4 shadow-sm">

                                        <input type="date" value="${reminderWeek}" onchange="selectTimetableReminderWeek(this.value)" class="rounded-lg border border-amber-200 bg-white px-2 py-1 text-xs text-slate-700">
