        window.selectTimetableHistory = function(id) {
            state.selectedTimetableHistoryId = id || '';
            renderLayout();
        };

        window.selectTimetableReminderWeek = function(value) {
            if (!value) return;
            state.timetableReminderWeek = getTimetableWeekStart(value);
            renderLayout();
        };

        window.filterTimetableReminderRecipients = function(group) {
            document.querySelectorAll('[data-timetable-recipient]').forEach(input => {
                const label = input.closest('[data-timetable-recipient-group]');
                if (label) label.classList.toggle('hidden', Boolean(group) && label.dataset.timetableRecipientGroup !== group);
            });
            updateTimetableReminderAllState();
        };

        window.toggleTimetableReminderRecipients = function(checked) {
            const group = document.getElementById('timetable-reminder-group')?.value || '';
            document.querySelectorAll('[data-timetable-recipient]').forEach(input => {
                const label = input.closest('[data-timetable-recipient-group]');
                if (!group || label?.dataset.timetableRecipientGroup === group) input.checked = checked;
            });
            updateTimetableReminderAllState();
        };

        function updateTimetableReminderAllState() {
            const visibleInputs = [...document.querySelectorAll('[data-timetable-recipient]')].filter(input =>
                !input.closest('[data-timetable-recipient-group]')?.classList.contains('hidden')
            );
            const all = document.getElementById('timetable-reminder-all');
            if (all) all.checked = visibleInputs.length > 0 && visibleInputs.every(input => input.checked);
        }

        window.addTimetableReminder = async function(day, session, rowIndex, input, date, recipientIds) {
            if (!state.auth || state.auth.role !== 'gvcn') {
                showToast('Chỉ GVCN mới được thêm lời nhắc thời khóa biểu.', 'error');
                return false;
            }
            if (state.selectedTimetableHistoryId) {
                showToast('Hãy chuyển về thời khóa biểu hiện tại trước khi thêm lời nhắc.', 'error');
                return false;
            }
            const message = String(input && input.value || '').trim();
            if (!message) {
                showToast('Vui lòng nhập nội dung lời nhắc.', 'error');
                return false;
            }
            if (message.length > 500) {
                showToast('Lời nhắc không được dài quá 500 ký tự.', 'error');
                return false;
            }
            const slot = getTimetableRows(session)[day - 1][rowIndex];
            const subject = String(slot && slot.subject || '').trim();
            if (!subject) {
                showToast('Hãy nhập môn học trước khi thêm lời nhắc.', 'error');
                return false;
            }
            const selectedRecipientIds = [...new Set((recipientIds || []).map(String).filter(Boolean))];
            if (!selectedRecipientIds.length) {
                showToast('Chọn ít nhất một người nhận lời nhắc.', 'error');
                return false;
            }

            const reminderDate = String(date || getTimetableDateForDay(state.timetableReminderWeek || getTimetableWeekStart(new Date()), day));
            const parsedDate = new Date(`${reminderDate}T00:00:00`);
            const normalizedDate = Number.isNaN(parsedDate.getTime())
                ? ''
                : `${parsedDate.getFullYear()}-${String(parsedDate.getMonth() + 1).padStart(2, '0')}-${String(parsedDate.getDate()).padStart(2, '0')}`;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(reminderDate) || normalizedDate !== reminderDate || parsedDate.getDay() !== day % 7) {
                showToast('Ngày nhắc phải đúng thứ của tiết học đã chọn.', 'error');
                return false;
            }
            const weekStart = getTimetableWeekStart(reminderDate);
            state.timetableReminderWeek = weekStart;
            if (!state.timetableReminders) state.timetableReminders = {};
            if (!Array.isArray(state.timetableReminders[weekStart])) state.timetableReminders[weekStart] = [];
            const previousReminders = [...state.timetableReminders[weekStart]];
            state.timetableReminders[weekStart].push({
                id: `reminder-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
                day,
                date: reminderDate,
                session,
                period: slot.period || `Tiết ${rowIndex + 1}`,
                time: slot.time || '--:--',
                subject,
                message,
                recipientIds: selectedRecipientIds,
                createdAt: new Date().toISOString()
            });
            try {
                await window.saveDataAndSyncCloud();
            } catch (error) {
                state.timetableReminders[weekStart] = previousReminders;
                if (!previousReminders.length) delete state.timetableReminders[weekStart];
                saveData();
                console.error('Không thể đồng bộ lời nhắc thời khóa biểu:', error);
                showToast(error.message || 'Không thể lưu lời nhắc thời khóa biểu vào database.', 'error');
                return false;
            }
            renderLayout();
            showToast(`Đã lưu lời nhắc ngày ${formatTimetableDate(reminderDate)}.`, 'success');
            return true;
        };

        window.updateTimetableSubject = function(day, session, rowIndex, value) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa thời khóa biểu.', 'error');
            if (state.selectedTimetableHistoryId) return showToast('Hãy chuyển về thời khóa biểu hiện tại trước khi chỉnh sửa.', 'error');
            const subject = value.trim();
            if (getTimetableRows(session)[day - 1][rowIndex].subject === subject) return;
            recordTimetableHistory('Sửa môn học');
            if (!state.dailySchedule) state.dailySchedule = {};
            if (!Array.isArray(state.dailySchedule[day])) state.dailySchedule[day] = [];

            const templates = getTimetableRows(session)[day - 1];
            while (entries.length <= rowIndex) {
                const entry = { ...templates[entries.length], session, subject: '', teacher: '' };
                state.dailySchedule[day].push(entry);
                entries.push(entry);
            }
            entries[rowIndex].subject = subject;
            saveData();

        window.updateTimetableSlotMeta = function(session, rowIndex, field, value) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa thời khóa biểu.', 'error');
            if (state.selectedTimetableHistoryId) return showToast('Hãy chuyển về thời khóa biểu hiện tại trước khi chỉnh sửa.', 'error');
            if (!['period', 'time'].includes(field)) return showToast('Trường thời khóa biểu không hợp lệ.', 'error');
            const metaValue = value.trim();
            const hasChanges = getTimetableRows(session).some(dayRows => dayRows[rowIndex][field] !== metaValue);
            if (!hasChanges) return;
            recordTimetableHistory(field === 'period' ? 'Sửa tên tiết' : 'Sửa giờ học');
            if (!state.dailySchedule) state.dailySchedule = {};
            for (let day = 1; day <= 6; day++) {
                if (!Array.isArray(state.dailySchedule[day])) state.dailySchedule[day] = [];
                const entries = state.dailySchedule[day].filter(entry => {
                    const hour = Number(String(entry.time || '').match(/(\d{1,2})(?::|h)/i)?.[1]);
                    return (entry.session || (hour >= 12 ? 'Chiều' : 'Sáng')) === session;
                });
                const templates = getTimetableRows(session)[day - 1];
                while (entries.length <= rowIndex) {
                    const entry = { ...templates[entries.length], session, subject: '', teacher: '', reminder: '' };
                    state.dailySchedule[day].push(entry);
                    entries.push(entry);
                }
                entries[rowIndex][field] = metaValue;

            renderLayout();

        window.addTimetableSlot = function(session) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa thời khóa biểu.', 'error');
            if (state.selectedTimetableHistoryId) return showToast('Hãy chuyển về thời khóa biểu hiện tại trước khi chỉnh sửa.', 'error');
            recordTimetableHistory('Thêm tiết học');
            if (!state.dailySchedule) state.dailySchedule = {};
            for (let day = 1; day <= 6; day++) {
                if (!Array.isArray(state.dailySchedule[day])) state.dailySchedule[day] = [];
                const slots = state.dailySchedule[day].filter(entry => {
                    const hour = Number(String(entry.time || '').match(/(\d{1,2})(?::|h)/i)?.[1]);
                    return (entry.session || (hour >= 12 ? 'Chiều' : 'Sáng')) === session;
                });
                if (!slots.length) {
                    getTimetableRows(session)[day - 1].forEach(entry => {
                        const defaultEntry = { ...entry, session, subject: '', teacher: '' };
                        state.dailySchedule[day].push(defaultEntry);
                        slots.push(defaultEntry);
                    });
                }
                const period = slots.length + 1;
                state.dailySchedule[day].push({
                    period: `Tiết ${period}`,
                    time: '--:--',
                    session,
                    subject: '',
                    teacher: '',
                    reminder: ''
                });
            }
            saveData();
            renderLayout();
        };

        // Xử lý đọc file Excel và đưa lịch học vào đúng ngày/buổi.
        window.handleTimetableExcelUpload = function(event) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được tải thời khóa biểu lên.', 'error');
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    const parsedSchedule = parseExcelToDailySchedule(rows);
                    if (!parsedSchedule) {
                        showToast('Không tìm thấy ít nhất hai cột ngày từ Thứ 2 đến Thứ 7 hoặc không có môn học để nhập.', 'error');
                        return;
                    }
                    if (JSON.stringify(parsedSchedule) !== JSON.stringify(state.dailySchedule || {})) {
                        recordTimetableHistory('Nhập thời khóa biểu từ Excel');
                    }
                    state.dailySchedule = parsedSchedule;
                    saveData();
                    renderLayout();
                    showToast('Đã nhập thời khóa biểu và tự chia buổi Sáng/Chiều.', 'success');
                } catch (error) {
                    console.error(error);
                    showToast("Lỗi đọc file Excel! Đảm bảo định dạng chuẩn.", "error");
                } finally {
                    event.target.value = '';
                }
            };
            reader.onerror = () => showToast('Không thể đọc file thời khóa biểu.', 'error');
            reader.readAsArrayBuffer(file);
        };

      // Hàm phân tích Excel tự động nhận diện Thứ và Tiết bóc dữ liệu ra state
       // Hàm phân tích Excel tự động (Thông minh - Không cần form mẫu cứng)
// Hàm phân tích Excel tự động (Thông minh - Cân mọi định dạng)
window.parseExcelToDailyScheduleLegacy = function(rows) {
    const schedule = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }; // Từ Thứ 2 (1) đến Thứ 7 (6)
    let headerRowIdx = -1;
    let dayCols = {};
    let timeColIdx = -1;
    let periodColIdx = -1;

    // Hàm hỗ trợ bỏ dấu tiếng Việt và khoảng trắng để so sánh dễ hơn
    const normalizeText = (text) => {
        if (!text) return '';
        return String(text).toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d").replace(/\s+/g, "");
    };

    // 1. Quét 15 dòng đầu để tìm dòng Tiêu đề (chứa các "Thứ")
    let maxDaysFound = 0;
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const row = rows[i];
        if (!row) continue;

        let foundDays = 0;
        let tempDayCols = {};
        let tempTimeCol = -1, tempPeriodCol = -1;

        for (let c = 0; c < row.length; c++) {
            const cell = normalizeText(row[c]);
            // Bắt mọi thể loại ghi chữ Thứ
            if (cell.includes('thu2') || cell === 'hai' || cell === 't2') { tempDayCols[1] = c; foundDays++; }
            else if (cell.includes('thu3') || cell === 'ba' || cell === 't3') { tempDayCols[2] = c; foundDays++; }
            else if (cell.includes('thu4') || cell === 'tu' || cell === 't4') { tempDayCols[3] = c; foundDays++; }
            else if (cell.includes('thu5') || cell === 'nam' || cell === 't5') { tempDayCols[4] = c; foundDays++; }
            else if (cell.includes('thu6') || cell === 'sau' || cell === 't6') { tempDayCols[5] = c; foundDays++; }
            else if (cell.includes('thu7') || cell.includes('thubay') || cell === 'bay' || cell === 't7') { tempDayCols[6] = c; foundDays++; }
            else if (cell.includes('thoigian') || cell.includes('time') || cell.includes('gio')) { tempTimeCol = c; }
            else if (cell.includes('tiet') || cell.includes('ca') || cell.includes('stt')) { tempPeriodCol = c; }
        }

        // Nếu tìm thấy ít nhất 2 ngày trong tuần, chắc chắn đây là dòng Header
        if (foundDays > maxDaysFound && foundDays >= 2) {
            maxDaysFound = foundDays;
            headerRowIdx = i;
            dayCols = tempDayCols;
            timeColIdx = tempTimeCol;
            periodColIdx = tempPeriodCol;
        }
    }

    if (headerRowIdx === -1) {
        console.warn("Không tìm thấy hàng tiêu đề chứa các 'Thứ' trong file Excel.");
        return; 
    }

    // Nếu bảng không có cột Tiết, tự động lấy cột ngay trước cột Thứ 2 (nếu có), hoặc lấy cột 0
    if (periodColIdx === -1) {
        periodColIdx = (dayCols[1] > 0) ? dayCols[1] - 1 : 0;
    }

    let periodCounter = 1;

    // 2. Duyệt các dòng bên dưới dòng tiêu đề để bóc tách dữ liệu
    for (let i = headerRowIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        // Xử lý cột Tiết (Lấy giá trị hoặc tự động đánh số nếu trống)
        let periodStr = '';
        const pCellRaw = row[periodColIdx];
        const pCellNorm = normalizeText(pCellRaw);
        
        // Reset biến đếm nếu gặp dòng "Buổi chiều"
        if (pCellNorm.includes('chieu')) periodCounter = 1;

        if (pCellRaw && String(pCellRaw).trim() !== '') {
            let val = String(pCellRaw).trim();
            if (!isNaN(val)) periodStr = `Tiết ${val}`; // Nếu chỉ ghi số 1, 2, 3
            else periodStr = val; // Giữ nguyên "Chào cờ", "SHL"
        } else {
            periodStr = `Tiết ${periodCounter}`;
        }

        // Xử lý cột Thời gian
        let timeStr = '--:--';
        if (timeColIdx !== -1 && row[timeColIdx]) {
            timeStr = String(row[timeColIdx]).trim().replace(/h/gi, ':');
        }

        let hasSubjectInRow = false;

        // 3. Trích xuất môn học cho từng Thứ
        for (let dayIndex = 1; dayIndex <= 6; dayIndex++) {
            const colIndex = dayCols[dayIndex];
            if (colIndex === undefined) continue;
            
            const subjectRaw = row[colIndex];
            if (subjectRaw && typeof subjectRaw === 'string' && subjectRaw.trim() !== '') {
                hasSubjectInRow = true;
                let mon = subjectRaw.trim();
                let gv = 'GV Bộ Môn';
                
                // Thuật toán tách Môn và Giáo viên thông minh
                if (mon.includes('\n')) {
                    const parts = mon.split('\n');
                    mon = parts[0].trim();
                    gv = parts.slice(1).join(' ').replace(/[-]/g, '').trim();
                } else if (mon.includes('-')) {
                    const parts = mon.split('-');
                    mon = parts[0].trim();
                    gv = parts.slice(1).join('-').trim();
                } else if (mon.includes('(')) {
                    const parts = mon.split('(');
                    mon = parts[0].trim();
                    gv = parts[1].replace(')', '').trim();
                }

                // Chỉ lấy nếu tên môn hợp lệ (bỏ qua rác)
                if (mon.length > 1) {
                    schedule[dayIndex].push({
                        period: periodStr.length > 15 ? `Tiết ${periodCounter}` : periodStr, // Rút gọn nếu chữ quá dài
                        time: timeStr,
                        subject: mon,
                        teacher: gv || 'GV Bộ Môn'
                    });
                }
            }
        }
        
        // Nếu dòng này có môn học thì mới tăng bộ đếm tiết
        if (hasSubjectInRow) periodCounter++;
    }
    
    state.dailySchedule = schedule;
};

window.parseExcelToDailySchedule = function(rows) {
    const schedule = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
    const normalize = value => String(value || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
    const identifyDay = value => {
        const text = normalize(value);
        if (['thu2', 'thuhai', 't2', 'hai'].includes(text)) return 1;
        if (['thu3', 'thuba', 't3', 'ba'].includes(text)) return 2;
        if (['thu4', 'thutu', 't4', 'tu'].includes(text)) return 3;
        if (['thu5', 'thunam', 't5', 'nam'].includes(text)) return 4;
        if (['thu6', 'thusau', 't6', 'sau'].includes(text)) return 5;
        if (['thu7', 'thubay', 't7', 'bay'].includes(text)) return 6;
        return 0;
    };
    const headerIndex = rows.findIndex(row => {
        const dayCount = new Set((row || []).map(identifyDay).filter(Boolean)).size;
        return dayCount >= 2;
    });
    if (headerIndex < 0) return null;

    const header = rows[headerIndex] || [];
    const dayColumns = {};
    let periodColumn = -1;
    let timeColumn = -1;
    header.forEach((value, index) => {
        const day = identifyDay(value);
        const text = normalize(value);
        if (day) dayColumns[day] = index;
        if (['tiet', 'ca', 'stt', 'period'].includes(text)) periodColumn = index;
        if (['gio', 'thoigian', 'time'].includes(text)) timeColumn = index;
    });
    if (Object.keys(dayColumns).length < 2) return null;
    if (periodColumn < 0) periodColumn = Math.max(0, (dayColumns[1] ?? Math.min(...Object.values(dayColumns))) - 1);

    let currentSession = 'Sáng';
    let counters = { Sáng: 1, Chiều: 1 };
    let hasSubject = false;
    for (let rowIndex = headerIndex + 1; rowIndex < rows.length; rowIndex++) {
        const row = rows[rowIndex] || [];
        if (!row.some(value => String(value || '').trim())) continue;
        const headerDays = new Set(row.map(identifyDay).filter(Boolean));
        if (headerDays.size >= 2) continue;

        const sectionText = row.map(normalize).join('');
        if (sectionText.includes('buoichieu')) {
            currentSession = 'Chiều';
            counters.Chiều = 1;
            continue;
        }
        if (sectionText.includes('buoisang')) {
            currentSession = 'Sáng';
            counters.Sáng = 1;
            continue;
        }

        const timeValue = timeColumn >= 0 ? String(row[timeColumn] || '').trim().replace(/h/gi, ':') : '';
        const periodValue = String(row[periodColumn] || '').trim();
        const normalizedPeriod = normalize(periodValue);
        if (normalizedPeriod.includes('chieu')) currentSession = 'Chiều';
        else if (normalizedPeriod.includes('sang')) currentSession = 'Sáng';
        const hourMatch = timeValue.match(/(\d{1,2})(?::|$)/);
        if (hourMatch) currentSession = Number(hourMatch[1]) >= 12 ? 'Chiều' : 'Sáng';

        const subjects = Object.entries(dayColumns).map(([day, column]) => [Number(day), String(row[column] || '').trim()]);
        const hasDayContent = subjects.some(([, subject]) => subject);
        if (!hasDayContent && !timeValue && !/^\d+$/.test(periodValue) && !/^ti[eế]t\s*\d+/i.test(periodValue)) continue;

        const period = periodValue
            ? (/^\d+$/.test(periodValue) ? `Tiết ${periodValue}` : periodValue)
            : `Tiết ${counters[currentSession]}`;
        const normalizedTime = timeValue || '--:--';
        for (const [day, subject] of subjects) {
            schedule[day].push({ period, time: normalizedTime, subject, teacher: 'GV Bộ Môn', session: currentSession });
            if (subject) hasSubject = true;
        }
        counters[currentSession]++;
    }

    return hasSubject ? schedule : null;
};

        window.draggedStudentId = null;
        function ensureSeatLayout() {
            if (!state.seatingChart || typeof state.seatingChart !== 'object') state.seatingChart = {};
            if (!Array.isArray(state.hiddenSeats)) state.hiddenSeats = [];
            if (!state.seatSides || typeof state.seatSides !== 'object') state.seatSides = {};
            if (!state.seatRows || typeof state.seatRows !== 'object') state.seatRows = {};
            const configuredIds = Object.keys(state.seatSides).filter(id => /^seat-\d+$/.test(id));
            const legacyTotal = Math.max(Number(state.totalSeats) || 0, configuredIds.length, 1);
            if (!configuredIds.length) {
                const leftCount = Math.ceil(legacyTotal / 2);
                for (let index = 1; index <= legacyTotal; index++) {
                    state.seatSides[`seat-${index}`] = index <= leftCount ? 'left' : 'right';
                }
            } else {
                let leftCount = configuredIds.filter(id => state.seatSides[id] === 'left').length;
                let rightCount = configuredIds.filter(id => state.seatSides[id] === 'right').length;
                for (let index = 1; index <= legacyTotal; index++) {
                    const seatId = `seat-${index}`;
                    if (state.seatSides[seatId] !== 'left' && state.seatSides[seatId] !== 'right') {
                        state.seatSides[seatId] = leftCount <= rightCount ? 'left' : 'right';
                        if (state.seatSides[seatId] === 'left') leftCount++;
                        else rightCount++;
                    }
                }
            }
            for (const side of ['left', 'right']) {
                const sideSeats = Object.keys(state.seatSides)
                    .filter(id => state.seatSides[id] === side)
                    .sort((a, b) => Number(a.replace('seat-', '')) - Number(b.replace('seat-', '')));
                sideSeats.forEach((seatId, index) => {
                    if (!Number.isInteger(Number(state.seatRows[seatId])) || Number(state.seatRows[seatId]) < 1) {
                        state.seatRows[seatId] = Math.floor(index / 4) + 1;
                    }
                });
            }
            state.totalSeats = Object.keys(state.seatSides).filter(id => /^seat-\d+$/.test(id)).length;
        }

        function addSeatsToSide(side, count, rowNumber) {
            ensureSeatLayout();
            let nextId = Object.keys(state.seatSides).reduce((max, id) => Math.max(max, Number(id.replace('seat-', '')) || 0), 0) + 1;
            const sideRows = Object.keys(state.seatSides)
                .filter(id => state.seatSides[id] === side)
                .reduce((rows, id) => {
                    const row = Number(state.seatRows[id]) || 1;
                    rows[row] = (rows[row] || 0) + 1;
                    return rows;
                }, {});
            let nextRow = Number(rowNumber) || Object.keys(sideRows).map(Number).sort((a, b) => b - a).find(row => sideRows[row] < 4) || (Math.max(0, ...Object.keys(sideRows).map(Number)) + 1);
            for (let index = 0; index < count; index++) {
                while (sideRows[nextRow] >= 4) nextRow++;
                const seatId = `seat-${nextId++}`;
                state.seatSides[seatId] = side;
                state.seatRows[seatId] = nextRow;
                sideRows[nextRow] = (sideRows[nextRow] || 0) + 1;
            }
            state.totalSeats = Object.keys(state.seatSides).length;
        }

            showToast('Đã chuyển học sinh về danh sách chờ.', 'success');
        };
        window.releaseStudentFromSeat = function(e, seatId) {
            if (!state.auth || state.auth.role !== 'gvcn') return;
            e.stopPropagation();
            delete state.seatingChart[seatId];
            saveData();
            renderLayout();
            showToast('Đã chuyển học sinh về danh sách chờ.', 'success');
        };

        // --- CÁC HÀM ẨN/HIỆN GHẾ TRỐNG ---
        window.hideSeat = function(e, seatId) {
            if (!state.auth || state.auth.role !== 'gvcn') return;
            e.stopPropagation();
            if (!state.hiddenSeats) state.hiddenSeats = [];
            if (!state.hiddenSeats.includes(seatId)) {
                state.hiddenSeats.push(seatId);
                saveData();
                renderLayout();
            }
        };
        
        window.restoreSeat = function(e, seatId) {
            if (!state.auth || state.auth.role !== 'gvcn') return;
            e.stopPropagation();
            if (state.hiddenSeats) {
                state.hiddenSeats = state.hiddenSeats.filter(id => id !== seatId);
                saveData();
                renderLayout();
            }
        };

       // CÁC HÀM XỬ LÝ THÊM DÃY / GHẾ MỚI
        window.addColumn = function(direction) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa sơ đồ lớp.', 'error');
            if (!['left', 'right'].includes(direction)) return showToast('Dãy ghế không hợp lệ.', 'error');
            addSeatsToSide(direction, 1);
            saveData();
            renderLayout();
            showToast(`Đã thêm 1 ghế vào dãy ${direction === 'left' ? 'trái' : 'phải'}.`, "success");
        };

        window.addColumnLeft = () => addColumn('left');
        window.addColumnRight = () => addColumn('right');

        window.addNewSeatRow = function() {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa sơ đồ lớp.', 'error');
            ensureSeatLayout();
            const nextRow = Math.max(0, ...Object.values(state.seatRows).map(Number)) + 1;
            addSeatsToSide('left', 4, nextRow);
            addSeatsToSide('right', 4, nextRow);
            saveData();
            renderLayout();
            showToast('Đã thêm một hàng ghế mới ở cả hai dãy.', 'success');
        };

        window.removeLastSeat = function() {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa sơ đồ lớp.', 'error');
            ensureSeatLayout();
            const seatId = Object.keys(state.seatSides).sort((a, b) => Number(b.replace('seat-', '')) - Number(a.replace('seat-', '')))[0];
            if (!seatId || state.totalSeats <= 1) return showToast('Sơ đồ phải có ít nhất một chỗ ngồi.', 'error');
            if (state.seatingChart && state.seatingChart[seatId] && !confirm('Ghế cuối đang có học sinh. Xóa ghế sẽ chuyển học sinh về danh sách chờ. Tiếp tục?')) return;
            if (state.seatingChart) delete state.seatingChart[seatId];
            if (state.hiddenSeats) state.hiddenSeats = state.hiddenSeats.filter(id => id !== seatId);
            delete state.seatSides[seatId];
            delete state.seatRows[seatId];
            state.totalSeats = Object.keys(state.seatSides).length;
            saveData();
            renderLayout();
            showToast('Đã xóa chỗ ngồi cuối sơ đồ.', 'success');
        };

        window.clearAllSeats = function() {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa sơ đồ lớp.', 'error');
            if (!confirm('Thu hồi toàn bộ học sinh khỏi chỗ ngồi và chuyển các em về danh sách chờ?')) return;
            state.seatingChart = {};
            saveData();
            renderLayout();
            showToast('Đã chuyển toàn bộ học sinh về danh sách chờ.', 'success');
        };

        window.autoArrangeSeats = function() {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa sơ đồ lớp.', 'error');
            if(confirm("Tự động xếp ngẫu nhiên tất cả học sinh chưa có chỗ vào các ghế trống?")) {
                const assignedIds = Object.values(state.seatingChart).map(String);
                const unassigned = state.students.filter(s => !assignedIds.includes(String(s.id)));
                let emptySeats = [];
                const maxSeats = state.totalSeats || 36;
                for (let i = 1; i <= maxSeats; i++) {
                    const seatId = 'seat-'+i;
                    if (!state.seatingChart[seatId] && !(state.hiddenSeats && state.hiddenSeats.includes(seatId))) {
                        emptySeats.push(seatId);
                    }
                }
                
                unassigned.sort(() => Math.random() - 0.5);
                
                unassigned.forEach(s => {
                    if(emptySeats.length > 0) {
                        const seat = emptySeats.shift();
                        state.seatingChart[seat] = s.id;
                    }
                });
                saveData(); renderLayout(); showToast("Đã xếp chỗ tự động!", "success");
            }
        };

        // --- GIAO DIỆN SƠ ĐỒ LỚP HỌC CHUYÊN NGHIỆP TỐI ƯU UI/UX ---

// ==========================================

        function renderViewLichBaoGiang() {
            if (!state.teachingSchedule) state.teachingSchedule = {};
            if (!state.activeDay) state.activeDay = 2; // Mặc định hiển thị Thứ 2
            const canEditSchedule = !!(state.auth && state.auth.role === 'gvcn');
            
            const days = [
                { id: 2, label: 'Thứ Hai' },
                { id: 3, label: 'Thứ Ba' },
                { id: 4, label: 'Thứ Tư' },
                { id: 5, label: 'Thứ Năm' },
                { id: 6, label: 'Thứ Sáu' },
                { id: 7, label: 'Thứ Bảy' }
            ];

            const excelDay = state.activeDay - 1; 
            let morningSlots = [];
            let afternoonSlots = [];

          // Đảm bảo có dữ liệu lịch chuẩn (Nếu trống thì tự tạo 8 tiết và gắn nhãn Sáng/Chiều)
            if (!state.dailySchedule) state.dailySchedule = {};
            if (!state.dailySchedule[excelDay] || state.dailySchedule[excelDay].length === 0) {
                state.dailySchedule[excelDay] = [
                    { period: 'Tiết 1', time: '07:15 - 08:00', session: 'Sáng' },
                    { period: 'Tiết 2', time: '08:00 - 08:45', session: 'Sáng' },
                    { period: 'Tiết 3', time: '09:05 - 09:50', session: 'Sáng' },
                    { period: 'Tiết 4', time: '09:50 - 10:35', session: 'Sáng' },
                    { period: 'Tiết 5', time: '10:45 - 11:30', session: 'Sáng' }
                ];
                if (state.activeDay !== 7) {
                    state.dailySchedule[excelDay].push(
                        { period: 'Tiết 6', time: '13:30 - 14:15', session: 'Chiều' },
                        { period: 'Tiết 7', time: '14:15 - 15:00', session: 'Chiều' },

        window.updateTeachingSlot = function(dayId, slotId, field, value) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa lịch báo giảng.', 'error');
            if (!state.teachingSchedule) state.teachingSchedule = {};
            const key = `${dayId}_${slotId}`;
            if (!state.teachingSchedule[key]) state.teachingSchedule[key] = { subject: '', teacher: '' };
            state.teachingSchedule[key][field] = value.trim();
            saveData();
        };
// HÀM XÓA VÀ TỰ ĐỘNG ĐẨY SỐ THỨ TỰ LÊN TRÊN (BẢN AN TOÀN CHỐNG LỖI)
       window.deleteTeachingSlot = function(dayId, index) {
            if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được chỉnh sửa lịch báo giảng.', 'error');
            const excelDay = dayId - 1;
            if (!state.dailySchedule || !state.dailySchedule[excelDay]) return;
            
            if (confirm("Cô có chắc muốn xóa tiết này không? Tên các tiết sẽ được đánh số lại tăng dần nhưng vẫn giữ nguyên buổi Sáng/Chiều.")) {
                recordTimetableHistory('Xóa tiết học');
                state.dailySchedule[excelDay].splice(index, 1);
                
                // Cập nhật lại tên tiết cho liền mạch (VD: Sáng 4 tiết thì Chiều bắt đầu từ Tiết 5)
                state.dailySchedule[excelDay].forEach((cls, i) => {
                    cls.period = "Tiết " + (i + 1);
                });
                
                // Dịch chuyển dữ liệu môn/giáo viên đã chọn từ ô dưới lên ô trên
                for (let i = index; i <= 20; i++) {
                    let currKey = dayId + "_s_" + i;
                    let nextKey = dayId + "_s_" + (i + 1);
                    if (state.teachingSchedule[nextKey]) {
                        state.teachingSchedule[currKey] = state.teachingSchedule[nextKey];
                    } else {
                        delete state.teachingSchedule[currKey];
                    }
                }
                
                saveData();
                renderLayout();
                showToast("Đã xóa tiết và đánh số thứ tự lại thành công!", "success");
            }
        };
// ==========================================
        // --- TÍNH NĂNG NHẮC NHỞ TIẾT DẠY TỰ ĐỘNG ---
        // ==========================================
        if (!window.teachingReminderInterval) {
            window.teachingReminderInterval = setInterval(() => {
                if (!state.teachingSchedule) return;
                
                const now = new Date();
                const currentDay = now.getDay(); // 0 là Chủ Nhật, 1: Thứ 2, ..., 6: Thứ 7
                if (currentDay === 0) return; // Chủ nhật nghỉ
                
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentTimeInMinutes = currentHour * 60 + currentMinute;
                
                // Khung giờ quy đổi ra phút để so sánh
                // Sáng: Tiết 1 (7:15), Tiết 2 (8:00), Tiết 3 (9:05), Tiết 4 (9:50), Tiết 5 (10:45)
                // Chiều: Tiết 1 (13:30), Tiết 2 (14:15), Tiết 3 (15:15)
                const slotTimes = {
                    'm1': 7 * 60 + 15,
                    'm2': 8 * 60 + 0,
                    'm3': 9 * 60 + 5,
                    'm4': 9 * 60 + 50,
                    'm5': 10 * 60 + 45,
                    'a1': 13 * 60 + 30,
                    'a2': 14 * 60 + 15,
                    'a3': 15 * 60 + 15
                };
                
                for (const slotId in slotTimes) {
                    const slotMinutes = slotTimes[slotId];
                    // Nhắc nhở trước đúng 3 phút khi chuẩn bị vào tiết
                    if (slotMinutes - currentTimeInMinutes === 3) {
                        const key = `${currentDay}_${slotId}`;
                        const lesson = state.teachingSchedule[key];
                        if (lesson && lesson.subject) {
                            showToast(`⚠️ Sắp vào tiết: ${lesson.subject} (${lesson.teacher || 'GV Bộ Môn'}) sau 3 phút nữa!`, "error");
                            if (typeof playBellSound === 'function') playBellSound(0); // Phát chuông báo
                        }
                    }
                }
            }, 60000); // Kiểm tra mỗi phút một lần
        }
// ==========================================

            const issue = document.getElementById('comp-issue').value.trim();
            const measures = document.getElementById('comp-measures').value.trim();

            if (!studentId) return showToast('Vui lòng chọn học sinh!', 'error');
            if (!issue) return showToast('Vui lòng nhập các lỗi hoặc vấn đề của học sinh!', 'error');

            if (id) {
                const idx = state.companions.findIndex(c => c.id == id);
                if (idx > -1) {
                    state.companions[idx] = { ...state.companions[idx], startDate, issue, measures };
                }
            } else {
                // Kiểm tra xem học sinh này đã có trong Trạm chưa
                const existing = state.companions.find(c => c.studentId == studentId);
                if(existing) return showToast('Học sinh này đang ở trong Trạm rồi, vui lòng bấm sửa Thẻ cũ!', 'error');

                state.companions.unshift({
                    id: Date.now(),
                    studentId: parseInt(studentId),
                    startDate,
                    issue,
                    measures
                });
            }
            saveData();
            renderLayout();
            closeModal('edit-companion-modal');

       // Xử lý nén và lưu Logo Trường (Dùng object-contain để ảnh nằm gọn trong khung)

            compressImage(file, (dataUrl) => {
                if (!state.theme) state.theme = {};
                state.theme.schoolLogo = dataUrl;

        // Xử lý nén và lưu ảnh Không gian học tập (Dùng object-cover để tràn viền đẹp mắt)
       window.handleLoginCoverUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, (dataUrl) => {
                if (!state.theme) state.theme = {};
                state.theme.loginBannerUrl = dataUrl; // Đã tách riêng thành loginBannerUrl
                saveData();
                renderLayout();
                showToast("Đã cập nhật Không gian học tập!", "success");
            }, 1200, 0.8);
        };

        // Logic xử lý đăng nhập theo tài khoản do GVCN cấp
        window.handleLogin = async function() {
            const username = (document.getElementById('login-username') || {}).value || '';
            const pwd = (document.getElementById('login-password') || {}).value || '';
            const selectedRole = normalizeAccountRole(state.loginRoleSelect);

            if (!username.trim() || !pwd.trim()) {
                showToast("Vui lòng nhập tài khoản và mật khẩu.", "error");
                return;
            }

            try {
                const client = await window.cloudReady;
                const { data, error } = await client.auth.signInWithPassword({
                    email: window.usernameToCloudEmail(username),
                    password: pwd.trim()
                });
                if (error) throw error;

                const { data: profile, error: profileError } = await client
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();
                if (profileError) throw profileError;
                if (normalizeAccountRole(profile.role) !== selectedRole) {
                    await client.auth.signOut();
                    throw new Error('Vai trò tài khoản không khớp. Hãy chọn đúng loại tài khoản.');
                }

                const legacyState = JSON.parse(localStorage.getItem('classManagerImportBackup') || localStorage.getItem('classManagerData') || '{}');
                const replaceExisting = Boolean(legacyState._legacyBackupPending && confirm('Dùng backup này cho lớp online? Nếu dữ liệu online đã tồn tại, backup sẽ thay thế toàn bộ.'));
                state.auth = { loggedIn: false, role: selectedRole };
                if (!await window.loadCloudClass(legacyState, replaceExisting)) throw new Error('Không thể tải dữ liệu lớp.');
                try {
                    await window.loadClassReminders();
                    window.notifyNewClassReminders();
                } catch (reminderError) {
                    console.error('Không thể tải lời nhắc:', reminderError);
                    showToast(reminderError.message || 'Lời nhắc chưa sẵn sàng. Hãy kiểm tra quyền truy cập database.', 'error');
                }
                state.currentTab = 'tong-quan';
                state.gradeRows = [];
                renderLayout();
                window.startTimetableReminderSync();
                window.startClassReminderSync();
                window.startStudentGradeSync();
                let gradeLoadError = '';
                try {
                    await window.loadGrades();
                } catch (error) {
                    console.error('Không thể tải bảng điểm sau khi đăng nhập:', error);
                    gradeLoadError = error.message || 'Không thể tải bảng điểm từ database.';
                }
                if (state.cloudMigrationPerformed) {
                    saveData();
                    const migrationErrors = state.cloudAccountMigrationErrors || 0;
                    const migrationSummary = `${state.cloudMigrationHadLegacy ? 'Đã chuyển dữ liệu cũ' : 'Đã tạo kho dữ liệu lớp'}${state.cloudMigratedAccounts ? ` và ${state.cloudMigratedAccounts} tài khoản` : ''} vào database.${state.cloudAccountMigrationErrors ? ` Có ${state.cloudAccountMigrationErrors} tài khoản cũ cần cấp lại.` : ''}`;
                    delete state.cloudMigrationPerformed;
                    delete state.cloudMigrationHadLegacy;
                    delete state.cloudMigratedAccounts;
                    delete state.cloudAccountMigrationErrors;
                    if (!migrationErrors) localStorage.removeItem('classManagerImportBackup');
                    showToast(migrationSummary, migrationErrors ? 'error' : 'success');
                } else if (state.cloudBackupPending) {
                    showToast('Database đã có dữ liệu nên backup chưa được nạp. Hãy đăng xuất và xác nhận thay thế khi đăng nhập lại nếu muốn.', 'error');
                    delete state.cloudBackupPending;
                } else if (gradeLoadError) {
                    showToast(`Đăng nhập thành công, nhưng không tải được bảng điểm: ${gradeLoadError}`, 'error');
                } else {
                    showToast(`Đăng nhập thành công (${selectedRole === 'gvcn' ? 'GVCN' : selectedRole === 'bcs' ? 'Cán bộ lớp' : 'Học sinh'})`, 'success');
                }
            } catch (error) {
                console.error('Đăng nhập hoặc đồng bộ database thất bại:', error);
                showToast(error.message || 'Không thể đăng nhập. Hãy kiểm tra tài khoản và cấu hình database.', 'error');
            }
        };

        window.updateAccountPermissionHint = function() {
            const role = (document.getElementById('new-account-role') || {}).value;
            const studentId = (document.getElementById('new-account-student') || {}).value;
            const student = (state.students || []).find(item => String(item.id) === String(studentId));
            const hint = document.getElementById('new-account-permission-hint');
            if (!hint) return;
            const descriptions = {
                'hocsinh': 'Học sinh',
                'bcs-lop-truong': 'Lớp trưởng',
                'bcs-to-truong': 'Tổ trưởng'
            };
            hint.textContent = role === 'bcs-to-truong' && student
                ? `Tổ trưởng${student.group ? ` · ${student.group}` : ''}`
                : descriptions[role] || descriptions.hocsinh;
        };

        window.syncNewAccountStudentName = function() {
            const studentId = (document.getElementById('new-account-student') || {}).value;
            const student = (state.students || []).find(item => String(item.id) === String(studentId));
            const nameInput = document.getElementById('new-account-name');
            if (nameInput) nameInput.value = student ? student.name : '';
            updateAccountPermissionHint();
        };

        window.createUserAccountFromSettings = async function() {
            const username = (document.getElementById('new-account-username') || {}).value || '';
            const password = (document.getElementById('new-account-password') || {}).value || '';
            const accountType = (document.getElementById('new-account-role') || {}).value || 'hocsinh';
            const role = accountType === 'hocsinh' ? 'hocsinh' : 'bcs';
            const studentId = (document.getElementById('new-account-student') || {}).value;
            const linkedStudent = (state.students || []).find(student => String(student.id) === String(studentId));

            if (!['hocsinh', 'bcs-lop-truong', 'bcs-to-truong'].includes(accountType)) {
                showToast('Vui lòng chọn vai trò tài khoản hợp lệ.', 'error');
                return;
            }
            if (!username.trim() || !password.trim() || !linkedStudent) {
                showToast('Hãy nhập tài khoản, mật khẩu và chọn học sinh đang có trong danh sách.', 'error');
                return;
            }
            if (!['hocsinh', 'bcs'].includes(role)) {
                showToast('Chỉ có thể cấp tài khoản cho học sinh trong danh sách.', 'error');
                return;
            }

            const duplicate = (state.users || []).find(user => String(user.username || '').trim().toLowerCase() === username.trim().toLowerCase());
            if (duplicate) {
                showToast('Tài khoản này đã tồn tại trong hệ thống!', 'error');
                return;
            }
            if ((state.users || []).some(user => ['hocsinh', 'bcs'].includes(user.role) && String(user.studentId) === String(linkedStudent.id))) {
                showToast('Học sinh này đã có tài khoản.', 'error');
                return;
            }

            if (role === 'bcs' && accountType === 'bcs-to-truong' && !String(linkedStudent.group || '').trim()) {
                showToast('Hãy phân học sinh vào một tổ trước khi cấp tài khoản tổ trưởng.', 'error');
                return;
            }

            try {
                const result = await window.cloudAccountRequest({
                    action: 'create',
                    username: username.trim(),
                    password: password.trim(),
                    role,
                    fullName: linkedStudent.name,
                    studentId: linkedStudent.id
                });
                state.users = [...(state.users || []), {
                    id: result.account.id,
                    username: result.account.username,
                    fullName: result.account.fullName,
                    role: result.account.role,
                    studentId: result.account.studentId
                }];
                if (role === 'bcs') linkedStudent.role = accountType === 'bcs-lop-truong' ? 'Lớp trưởng' : 'Tổ trưởng';
                saveData();
                renderLayout();
                showToast('Đã cấp tài khoản mới trong database.', 'success');
            } catch (error) {
                console.error('Không thể cấp tài khoản:', error);
                showToast(error.message || 'Không thể cấp tài khoản mới.', 'error');
            }
        };

        window.resetUserPassword = async function(userId) {
            const user = (state.users || []).find(item => item.id === userId);
            if (!user) return showToast('Không tìm thấy tài khoản để đổi mật khẩu!', 'error');
            const newPassword = prompt(`Nhập mật khẩu mới (ít nhất 6 ký tự) cho ${user.fullName || user.username}:`);
            if (newPassword === null) return;
            const value = newPassword.trim();
            if (value.length < 6) return showToast('Mật khẩu mới cần ít nhất 6 ký tự.', 'error');
            try {
                await window.cloudAccountRequest({ action: 'password', userId, password: value });
                showToast('Đã cập nhật mật khẩu tài khoản.', 'success');
            } catch (error) {
                console.error('Không thể đổi mật khẩu:', error);
                showToast(error.message || 'Không thể đổi mật khẩu.', 'error');
            }
        };

        window.deleteUserAccount = async function(userId) {
            const user = (state.users || []).find(item => item.id === userId);
            if (!user) return showToast('Không tìm thấy tài khoản cần xóa!', 'error');
            if (user.role === 'gvcn') return showToast('Không được xóa tài khoản GVCN mặc định!', 'error');
            if (!confirm(`Bạn có chắc muốn xóa tài khoản ${user.fullName || user.username}?`)) return;
            try {
                await window.cloudAccountRequest({ action: 'delete', userId });

window.copyParentMessage = function(studentId) {
    const student = state.students.find(s => s.id === studentId);
    if (!student) return;

    // Sắp xếp lịch sử theo thời gian từ cũ nhất đến mới nhất
    const sortedHistory = [...(student.history || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
    
    if (sortedHistory.length === 0) {
        showToast("Học sinh này chưa có ghi nhận nào!", "error");
        return;
    }

    const startDateObj = new Date(sortedHistory[0].date);
    const endDateObj = new Date(sortedHistory[sortedHistory.length - 1].date);
    
    const startDateStr = `${String(startDateObj.getDate()).padStart(2, '0')}/${String(startDateObj.getMonth()+1).padStart(2, '0')}/${startDateObj.getFullYear()}`;
    const endDateStr = `${String(endDateObj.getDate()).padStart(2, '0')}/${String(endDateObj.getMonth()+1).padStart(2, '0')}/${endDateObj.getFullYear()}`;

    let message = `Kính gửi PHHS em ${student.name},\n\nGVCN xin thông báo về tình hình rèn luyện của bạn ${student.name} từ ngày ${startDateStr} đến ngày ${endDateStr}\n\nChi tiết:\n`;
    
    let hasNegative = false;
    
    sortedHistory.forEach(h => {
        const dObj = new Date(h.date);
        const dStr = `${String(dObj.getDate()).padStart(2, '0')}/${String(dObj.getMonth()+1).padStart(2, '0')}`;
        if (h.points < 0) {
            message += `- Ngày ${dStr}: ${h.reason} (${h.points} điểm)\n`;
            hasNegative = true;
        } else {
            message += `- Ngày ${dStr}: ${h.reason} (+${h.points} điểm)\n`;
        }
    });

    message += '\n';
    if (hasNegative) {
        message += `Mong quý Phụ huynh phối hợp GVCN nhắc nhở em học tập và rèn luyện.\n`;
    } else {
        message += `Mong quý Phụ huynh tiếp tục động viên em phát huy.\n`;
    }
    
    message += `Trân trọng!`;

    navigator.clipboard.writeText(message).then(() => {
        showToast(`Đã sao chép tin nhắn của ${student.name}`, "success");
    }).catch(err => {
        showToast("Lỗi khi sao chép!", "error");
    });
};

            let autoStats = {
                tre: [0, 0, 0, 0, 0], // Đi trễ
                nghi: [0, 0, 0, 0, 0], // Nghỉ học (P + KP)
                khen: [0, 0, 0, 0, 0], // Việc tốt / Khen thưởng (> 0 điểm)
                phat: [0, 0, 0, 0, 0]  // Vi phạm / Nhắc nhở (< 0 điểm)
            };

            const [year, month] = mKey.split('-');
            
            // Hàm tính Tuần (1-5) dựa vào ngày trong tháng
            const getWeekIndex = (day) => Math.min(4, Math.floor((day - 1) / 7));

            // 1. Quét dữ liệu điểm danh
            if (state.attendanceRecords) {
                Object.keys(state.attendanceRecords).forEach(recordKey => {
                    const dateStr = recordKey.split('_')[0]; // Lấy phần ngày (VD: 2026-09-15)
                    if (dateStr.startsWith(mKey)) {
                        const day = parseInt(dateStr.split('-')[2]);
                        const wIdx = getWeekIndex(day);
                        
                        Object.values(state.attendanceRecords[recordKey]).forEach(status => {
                            if (status === 'late') autoStats.tre[wIdx]++;
                            if (status === 'excused' || status === 'unexcused') autoStats.nghi[wIdx]++;
                        });
                    }
                });
            }

            // 2. Quét dữ liệu thi đua (Khen / Phạt)
            state.students.forEach(s => {
                if (s.history) {
                    s.history.forEach(h => {
                        if (h.date && h.date.startsWith(mKey)) {
                            // Không tính lại điểm do hệ thống tự cộng khi điểm danh (tránh lặp kép)
                            if (h.isAttendance) return; 

                            const day = parseInt(h.date.split('-')[2]);
                            const wIdx = getWeekIndex(day);
                            if (h.points > 0) autoStats.khen[wIdx]++;
                            if (h.points < 0) autoStats.phat[wIdx]++;
                        }
                    });
                }
            });

            // Hàm tạo các ô nhập liệu cho phần thủ công (Sổ đầu bài, Xếp hạng)
            const renderInputs = (type) => {
                let html = '';
                let total = 0;
                for (let i = 0; i < 5; i++) {
                    const val = planData[type][i];
                    if (type === 'sdb') total += (parseInt(val) || 0);
                    html += `<td class="p-2 border border-slate-200"><input type="${type==='sdb'?'number':'text'}" value="${val}" onchange="updatePlanData('${mKey}', '${type}', ${i}, this.value)" class="w-full text-center font-bold text-slate-700 bg-transparent outline-none focus:bg-amber-50 rounded px-1"></td>`;
                }
                html += `<td class="p-2 border border-slate-200 text-center font-black text-amber-600 bg-amber-50/50">${type==='sdb' ? total : '-'}</td>`;
                return html;
            };

            // Hàm tạo các ô dữ liệu tự động
            const renderAutoCells = (arr, colorClass) => {
                let html = '';
                let total = 0;
                for (let i = 0; i < 5; i++) {
                    total += arr[i];
                    html += `<td class="p-3 border border-slate-200 text-center font-bold ${arr[i] > 0 ? colorClass : 'text-slate-300'}">${arr[i]}</td>`;
                }
                html += `<td class="p-3 border border-slate-200 text-center font-black ${total > 0 ? colorClass : 'text-slate-300'} bg-slate-50">${total}</td>`;
                return html;
            };

            return `
                <div class="max-w-6xl mx-auto space-y-6 animate-fade-in pb-12 pt-2">
                    
                    <!-- Tiêu đề & Chọn tháng -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-4 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-[#1e1b4b] tracking-tight flex items-center gap-3">
                                <div class="p-2.5 bg-blue-50 text-blueAccent rounded-xl shadow-sm"><i class="ph-fill ph-calendar-star text-2xl"></i></div> 
                                Kế Hoạch & Sơ Kết
                            </h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Lập kế hoạch tuần và theo dõi thống kê thi đua tự động.</p>
                        </div>
                        <input type="month" value="${mKey}" onchange="window.currentPlanMonth = this.value; renderLayout();" class="px-5 py-3 bg-white border border-slate-200 rounded-xl text-sm font-black text-slate-700 shadow-sm outline-none focus:border-blueAccent cursor-pointer">
                    </div>

                    <!-- KHU VỰC 1: KẾ HOẠCH THÁNG -->
                    <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-200 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-40 h-40 bg-blue-50 rounded-bl-full -mr-10 -mt-10 z-0 opacity-50"></div>
                        
                        <div class="flex justify-between items-center mb-6 relative z-10">
                            <h3 class="font-black text-slate-800 uppercase tracking-wide text-lg flex items-center gap-2">
                                <i class="ph-fill ph-notepad text-blueAccent"></i> NỘI DUNG KẾ HOẠCH THÁNG ${month}/${year}
                            </h3>
                            <button onclick="document.getElementById('upload-word').click()" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-bold rounded-xl hover:bg-indigo-100 transition-colors text-xs flex items-center gap-2 border border-indigo-100 shadow-sm">
                                <i class="ph-bold ph-file-doc text-lg"></i> Tải file Word (.docx)
                            </button>
                            <input type="file" id="upload-word" class="hidden" accept=".docx" onchange="handleWordUpload(event, '${mKey}')">
                        </div>

                        <div class="space-y-4 relative z-10">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Nội dung kế hoạch</label>
                                <textarea id="plan-noidung" onchange="updatePlanText('${mKey}', 'noiDung', this.value)" rows="4" placeholder="VD: Ổn định nề nếp, Sơ kết học kì 1..." class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium text-slate-700 outline-none focus:border-blueAccent focus:bg-white transition-all resize-y shadow-inner leading-relaxed">${planData.noiDung}</textarea>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest text-rose-500">Trọng tâm</label>
                                <input type="text" id="plan-trongtam" onchange="updatePlanText('${mKey}', 'trongTam', this.value)" value="${escapeHtmlAttr(planData.trongTam)}" placeholder="VD: Đảm bảo chuyên cần sau Tết..." class="w-full px-5 py-3.5 bg-rose-50/30 border border-rose-100 rounded-xl text-sm font-bold text-rose-700 outline-none focus:border-rose-400 transition-all shadow-sm">
                            </div>
                        </div>
                    </div>

                    <!-- KHU VỰC 2: BẢNG SƠ KẾT TỰ ĐỘNG -->
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 md:p-8 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white">
                            <h3 class="font-black text-slate-800 uppercase tracking-wide text-lg flex items-center gap-2">
                                <i class="ph-fill ph-chart-line-up text-emerald-500"></i> SƠ KẾT THÁNG ${month}
                            </h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">Các chỉ số được tổng hợp tự động từ phần Điểm Danh và Tích Điểm.</p>
                        </div>
                        
                        <div class="p-4 md:p-6 overflow-x-auto custom-scrollbar">
                            <table class="w-full min-w-[700px] border-collapse text-sm">
                                <thead>
                                    <tr class="bg-[#1e1b4b] text-white">
                                        <th class="p-3 text-left font-bold border border-slate-700 rounded-tl-xl">Nội dung / Tiêu chí</th>
                                        <th class="p-3 text-center font-bold border border-slate-700 w-16">Tuần 1</th>
                                        <th class="p-3 text-center font-bold border border-slate-700 w-16">Tuần 2</th>
                                        <th class="p-3 text-center font-bold border border-slate-700 w-16">Tuần 3</th>
                                        <th class="p-3 text-center font-bold border border-slate-700 w-16">Tuần 4</th>
                                        <th class="p-3 text-center font-bold border border-slate-700 w-16">Tuần 5</th>
                                        <th class="p-3 text-center font-black text-amber-300 border border-slate-700 w-20 rounded-tr-xl">THÁNG</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2"><i class="ph-bold ph-clock text-yellow-500"></i> Số lượt học sinh đi trễ</td>
                                        ${renderAutoCells(autoStats.tre, 'text-yellow-600')}
                                    </tr>
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2"><i class="ph-bold ph-user-minus text-rose-500"></i> Số lượt học sinh nghỉ học</td>
                                        ${renderAutoCells(autoStats.nghi, 'text-rose-600')}
                                    </tr>
                                    <tr class="hover:bg-amber-50/30 transition-colors bg-slate-50/50">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2">
                                            <i class="ph-bold ph-book-open text-blue-500"></i> Số lượt vi phạm sổ đầu bài 
                                            <span class="text-[9px] bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-400">Nhập tay</span>
                                        </td>
                                        ${renderInputs('sdb')}
                                    </tr>
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2"><i class="ph-bold ph-warning-circle text-orange-500"></i> Số lượt vi phạm (Quản nhiệm)</td>
                                        ${renderAutoCells(autoStats.phat, 'text-orange-600')}
                                    </tr>
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2"><i class="ph-bold ph-star text-emerald-500"></i> Số HS được khen, làm việc tốt</td>
                                        ${renderAutoCells(autoStats.khen, 'text-emerald-600')}
                                    </tr>
                                    <tr class="hover:bg-amber-50/30 transition-colors bg-slate-50/50">
                                        <td class="p-3 border border-slate-200 font-bold text-slate-700 flex items-center gap-2">
                                            <i class="ph-bold ph-trophy text-amber-500"></i> Xếp hạng lớp
                                            <span class="text-[9px] bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-400">Nhập tay</span>
                                        </td>
                                        ${renderInputs('rank')}
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- CÁC HÀM XỬ LÝ DỮ LIỆU ---
        window.updatePlanText = function(month, field, value) {
            state.plans[month][field] = value;
            saveData();
            showToast("Đã lưu nội dung!", "success");
        };

        window.updatePlanData = function(month, type, index, value) {
            state.plans[month][type][index] = value;
            saveData();
            renderLayout(); // Render lại để tính tổng cột Tháng
        };

        // Hàm đọc file Word bằng thư viện Mammoth
        window.handleWordUpload = function(event, monthKey) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;
                
                // Gọi Mammoth để chuyển Word thành text
                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        const text = result.value;
                        document.getElementById('plan-noidung').value = text;
                        state.plans[monthKey].noiDung = text;
                        saveData();
                        showToast("Đã tải nội dung từ file Word thành công!", "success");
                    })
                    .catch(function(err) {
                        console.error(err);
                        showToast("Lỗi khi đọc file Word. Hãy đảm bảo file đúng định dạng .docx", "error");
                    });
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; // Reset input
        };

window.deleteHistoryRecord = function(studentId, recordId) {
    if (!state.auth || state.auth.role !== 'gvcn') return showToast('Chỉ GVCN mới được xóa lịch sử điểm.', 'error');
    // 1. Tìm học sinh trong danh sách
    const student = state.students.find(s => s.id === studentId);
    if (!student) return;

    // 2. Tìm vị trí của dòng lịch sử cần xóa (dùng == để khớp cả chuỗi lẫn số)
    const recordIndex = student.history.findIndex(h => h.id == recordId);
    if (recordIndex === -1) return;

    // 3. Hiển thị hộp thoại xác nhận
    if (confirm("Cô có chắc chắn muốn xóa lịch sử này và hoàn tác lại điểm không?")) {
        const record = student.history[recordIndex];
        
        // 4. Hoàn tác lại Tổng điểm
        student.points = (student.points || 0) - record.points;
        
        // 5. Hoàn tác lại điểm Sao (chỉ trừ đi nếu lịch sử đó là cộng điểm)
        if (record.points > 0) {
            student.stars = Math.max(0, (student.stars || 0) - record.points);
        } else {
            student.stars = (student.stars || 0) - record.points; 
        }

        // 6. Cắt bỏ dòng lịch sử đó khỏi mảng
        student.history.splice(recordIndex, 1);

        // 7. Lưu dữ liệu và tải lại giao diện
        if (typeof saveData === 'function') saveData();
        openStudentHistoryModal(studentId); // Làm mới lại bảng lịch sử đang mở
        renderLayout(); // Làm mới lại bảng điểm bên ngoài
        
        if (typeof showToast === 'function') {
            showToast("Đã xóa lịch sử và hoàn tác điểm!", "success");
        }
    }
};
 </script>
</body>
</html>
